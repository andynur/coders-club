<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro React Journey · HSI Boarding School</title>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>var t="light";try{t=localStorage.getItem("hsi-theme")||"light";}catch(e){}document.documentElement.setAttribute("data-theme",t);</script>
<meta name="description" content="Slide pengantar React.js Fundamental — Student Learning Handbook Level 2, HSI Boarding School Purworejo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Token: sama dengan handbook (landing/style.css) ===== */
:root{
  --bg:#ffffff; --bg-side:#f9f8f6; --bg-soft:#f6f5f2; --bg-hover:rgba(55,53,47,.06);
  --text:#2f2e2b; --text-2:#5f5e5a; --muted:#94928d; --border:#ecebe7; --border-2:#dfddd8;
  --blue:#2563eb; --blue-text:#1d4fd7; --blue-bg:#edf3fe;
  --gold:#b7820c; --gold-strong:#f0b93a; --gold-bg:#fcf5e1;
  --green:#2d8a4e; --green-bg:#ecf6ef; --red:#cf4237; --red-bg:#fcefed;
  --teal:#0e8fae; --purple:#7c4dcc; --gray-bg:#f3f2ef;
  --code-bg:#f7f6f3; --code-text:#37352f; --inline-code:#c2410c;
  --on-accent:#ffffff;
  --skin:#f1c19c; --skin-2:#e3ab84; --hair:#2d2b33; --shirt:#ffffff; --shirt-line:#e3e0d8;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(15,15,15,.06);
  --shadow:0 1px 3px rgba(15,15,15,.06),0 6px 20px -8px rgba(15,15,15,.14);
  --shadow-lg:0 14px 44px -12px rgba(15,15,15,.22);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --bg-side:#202020; --bg-soft:#232323; --bg-hover:rgba(255,255,255,.055);
    --text:#e8e7e4; --text-2:#b9b8b3; --muted:#7f7d79; --border:#2d2d2d; --border-2:#3a3a3a;
    --blue:#6a9cff; --blue-text:#8db3ff; --blue-bg:#1d2738; --gold:#f0c35a; --gold-bg:#33291a;
    --green:#5ec486; --green-bg:#1d2f24; --red:#f07a6e; --red-bg:#3a2220; --teal:#4cc3dc; --purple:#a888f0; --gray-bg:#2a2a2a;
    --code-bg:#232323; --code-text:#e3e2de; --inline-code:#f59e7a; --on-accent:#111111;
    --shirt:#f4f2ed; --shirt-line:#cfcabd;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px -8px rgba(0,0,0,.6); --shadow-lg:0 14px 44px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --bg-side:#202020; --bg-soft:#232323; --bg-hover:rgba(255,255,255,.055);
  --text:#e8e7e4; --text-2:#b9b8b3; --muted:#7f7d79; --border:#2d2d2d; --border-2:#3a3a3a;
  --blue:#6a9cff; --blue-text:#8db3ff; --blue-bg:#1d2738; --gold:#f0c35a; --gold-bg:#33291a;
  --green:#5ec486; --green-bg:#1d2f24; --red:#f07a6e; --red-bg:#3a2220; --teal:#4cc3dc; --purple:#a888f0; --gray-bg:#2a2a2a;
  --code-bg:#232323; --code-text:#e3e2de; --inline-code:#f59e7a; --on-accent:#111111;
  --shirt:#f4f2ed; --shirt-line:#cfcabd;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px -8px rgba(0,0,0,.6); --shadow-lg:0 14px 44px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
code{font-family:var(--mono);font-size:.86em}
p code,li code,small code,.wb small code{background:var(--gray-bg);padding:1px 5px;border-radius:4px;color:var(--inline-code)}

/* ===== Primitives ===== */
.clay-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
/* ikon: kotak tint ala Notion page icon */
.clay{
  --s:64px;--c:var(--blue);
  width:var(--s);height:var(--s);flex:0 0 var(--s);border-radius:calc(var(--s)*.26);display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 13%,var(--bg));color:var(--c);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent);
}
.clay svg{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.clay.xs{--s:30px}.clay.sm{--s:38px}.clay.md{--s:48px}.clay.lg{--s:64px}.clay.xl{--s:84px}
.clay.btn{border:0;transition:transform .2s}
.clay.btn:hover{transform:translateY(-2px)}

.cbtn{
  --c:var(--blue);border:1px solid transparent;border-radius:8px;padding:10px 18px;font-weight:600;font-size:15px;color:var(--on-accent);text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;background:var(--c);box-shadow:var(--shadow-sm);transition:filter .15s,transform .15s;
}
.cbtn:hover{filter:brightness(1.08)}.cbtn:active{transform:scale(.97)}
.cbtn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.cbtn.sm{padding:6px 12px;font-size:13px;border-radius:6px}
.cbtn.ghost{background:var(--bg);color:var(--text);border-color:var(--border-2)}
.cbtn.ghost:hover{background:var(--bg-hover);filter:none}

.chip{
  --c:var(--blue);display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-sm);font-weight:600;font-size:12.5px;
  color:color-mix(in srgb,var(--c) 78%,var(--text));background:color-mix(in srgb,var(--c) 12%,var(--bg));
  border:0;text-decoration:none;white-space:nowrap;font-family:var(--font);
}
button.chip,a.chip{transition:filter .15s}button.chip:hover,a.chip:hover{filter:brightness(.95)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:var(--r-sm);background:var(--gray-bg);font-weight:500;font-size:13px;color:var(--text-2)}
.pill b{color:var(--text);font-weight:600}

/* ===== Deck ===== */
.progress{position:fixed;top:0;left:0;height:3px;background:var(--blue);transition:width .5s cubic-bezier(.22,1,.36,1);z-index:60}
.brand{position:fixed;top:12px;left:16px;z-index:55;display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;color:var(--muted);
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:4px 10px 4px 4px;border-radius:8px}
.brand .clay{--s:26px;border-radius:7px;--c:var(--blue);background:var(--blue);color:#fff;box-shadow:none}
.brand .clay svg{stroke-width:2.2;width:62%;height:62%}
.brand b{color:var(--text);font-weight:600}
.brand .sep{color:var(--border-2)}
.brand #crumb{color:var(--text-2)}
.deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 24px 112px;
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .35s ease,transform .45s cubic-bezier(.22,1,.36,1),visibility .35s;
}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.left{transform:translateY(-14px)}
.wrap{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:26px}
h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;line-height:1.08;letter-spacing:-.04em}
h2{font-size:clamp(26px,3.6vw,40px);font-weight:800;line-height:1.15;letter-spacing:-.03em}
h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
p{font-size:17px;line-height:1.65;color:var(--text-2)}
p b,li b{color:var(--text);font-weight:600}
/* highlight ala hero handbook: teks biru + stabilo emas */
.grad{color:var(--blue);position:relative;white-space:nowrap;isolation:isolate}
.grad::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.24em;background:var(--gold-strong);opacity:.45;z-index:-1;border-radius:3px}
.eyebrow{font-weight:600;color:var(--muted);letter-spacing:.04em;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--blue)}
.hint{color:var(--muted);font-weight:500;font-size:13px}
kbd{font:500 11.5px var(--mono);background:var(--bg-soft);padding:2px 6px;border-radius:4px;border:1px solid var(--border-2);border-bottom-width:2px;color:var(--text-2)}

/* cover */
.cover{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.cover-logo{display:flex;align-items:center;gap:12px}
.cover-logo b{display:block;font-size:15px;color:var(--text);font-weight:600}
.cover-logo small{font-weight:500;color:var(--muted);font-size:13px}
.cover-meta{display:flex;gap:8px;flex-wrap:wrap}

/* ilustrasi: sama dengan stage hero handbook */
.hero-art{position:relative;aspect-ratio:1/.92;width:100%;max-width:470px;justify-self:center}
.hero-art::before{content:"";position:absolute;inset:2%;
  background-image:radial-gradient(var(--border-2) 1.2px,transparent 1.3px);background-size:18px 18px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 70%);mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 70%)}
.hero-art .scene{position:absolute;inset:8% 9% 2%}
.hero-art .scene svg{width:100%;height:100%;overflow:visible}
.blob{fill:var(--blue-bg)}.blob-2{fill:var(--gold-bg)}
.skin{fill:var(--skin)}.skin-2{fill:var(--skin-2)}.hair{fill:var(--hair)}
.shirt{fill:var(--shirt);stroke:var(--shirt-line);stroke-width:2}
.desk{fill:var(--border-2)}.laptop-back{fill:var(--blue)}.laptop-base{fill:var(--border-2)}
.head-bob{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hand-l{animation:type .45s ease-in-out infinite alternate}
.hand-r{animation:type .45s .22s ease-in-out infinite alternate}
.logo-spin{animation:spin 10s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes type{to{transform:translateY(-4px)}}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.floaters{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;left:var(--x);top:var(--y);color:var(--c,var(--blue));animation:drift var(--d,6s) ease-in-out var(--delay,0s) infinite alternate}
.fl>svg{width:var(--s,22px);height:var(--s,22px);display:block}
@keyframes drift{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(var(--tx,0px),var(--ty,-14px)) rotate(var(--rot,20deg))}}
.fl.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .55rem;border-radius:8px;background:var(--bg);
  border:1px solid var(--border);box-shadow:var(--shadow);font:600 12px var(--mono);color:var(--text);--rot:0deg}
.fl.chip svg{width:14px;height:14px;color:var(--c,var(--blue));fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.plane{position:absolute;left:0;top:0;width:26px;color:var(--blue);animation:fly 12s linear infinite;opacity:0}
.plane svg{width:26px;height:26px;display:block}
@keyframes fly{0%{transform:translate(-20px,300px) rotate(-10deg);opacity:0}8%{opacity:1}45%{transform:translate(180px,150px) rotate(-22deg)}90%{opacity:1}100%{transform:translate(440px,-20px) rotate(-30deg);opacity:0}}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail path{fill:none;stroke:var(--border-2);stroke-width:1.5;stroke-dasharray:3 7;animation:dash 18s linear infinite}
@keyframes dash{to{stroke-dashoffset:-400}}

/* welcome */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.stat{padding:18px 20px;display:flex;gap:14px;align-items:center;border:0;border-right:1px solid var(--border);border-radius:0;box-shadow:none}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--text)}
.stat span{font-weight:500;font-size:14px;color:var(--muted)}
.quote{padding:16px 20px;border-radius:var(--r-sm);background:var(--bg);border-left:3px solid var(--text);
  font-size:18px;font-weight:500;color:var(--text);line-height:1.55}

/* grids */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.box{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box ul,.box ol{list-style:none;display:flex;flex-direction:column;gap:9px}
.box li{font-size:15.5px;line-height:1.55;color:var(--text-2);padding-left:22px;position:relative}
.box ul li::before{content:"";position:absolute;left:6px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--dot,var(--text))}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.steps{counter-reset:st}
.steps li{padding-left:36px!important;min-height:26px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  font-weight:600;font-size:12.5px;color:var(--blue-text);background:var(--blue-bg)}

/* wireframe */
.wire{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;padding:16px;background:var(--bg-side)}
.wire-main{display:grid;gap:10px;grid-template-columns:repeat(6,minmax(0,1fr))}
.wb{--c:var(--muted);border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--bg));border-radius:var(--r);
  padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-weight:600;font-size:13.5px;color:var(--text);min-height:64px;min-width:0}
.wb small{font-weight:500;color:var(--muted);font-size:12px}
.wb .cmp{overflow-wrap:anywhere;font:500 12px var(--mono);color:color-mix(in srgb,var(--c) 80%,var(--text))}
.wb .chips{display:flex;gap:5px;flex-wrap:wrap}
.wb .chip{padding:2px 8px;font-size:11.5px}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
.wire-side{min-height:100%}

/* code: blok kode ala Notion */
.code-card{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;min-width:0}
.code-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px 0 14px;color:var(--muted);font:500 12px var(--mono)}
.dots{display:flex;gap:5px;margin-right:8px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--border-2)}
.code-card pre{padding:10px 16px 16px;overflow:auto;max-height:300px}
.code-card.tall pre{max-height:420px}
.code-card code{font:400 13px/1.7 var(--mono);color:var(--code-text);white-space:pre}
.copy{background:var(--bg);color:var(--text-2);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:3px 9px;font-weight:500;font-size:12px}
.copy:hover{background:var(--bg-hover)}
.mini{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;overflow:auto}
.mini code{font:400 12.5px/1.6 var(--mono);color:var(--code-text);white-space:pre}
/* callout ala Notion */
.key-note{--c:var(--blue);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-sm);
  background:color-mix(in srgb,var(--c) 9%,var(--bg))}
.key-note p{font-size:15px;color:var(--text);line-height:1.55}

/* tools */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{display:flex;gap:10px;align-items:center;background:var(--bg);padding:8px 10px;border-radius:var(--r);min-width:0;border:1px solid var(--border)}
.tool b{display:block;font-size:14.5px;font-weight:600}
.tool small{display:block;color:var(--muted);font-size:12.5px}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.phase-col{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;font:inherit;color:var(--text);transition:box-shadow .2s,transform .2s,border-color .2s;
  border-top:3px solid var(--c,var(--blue))}
.phase-col:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-2);border-top-color:var(--c,var(--blue))}
.phase-col .ph-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.phase-col .ph-h small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.phase-col .ph-h b{font-size:16px;font-weight:700;line-height:1.2}
.meet-mini{display:flex;gap:10px;align-items:center;border-radius:var(--r-sm);padding:6px 8px;font-weight:500;font-size:13.5px;line-height:1.35;color:var(--text)}
.meet-mini:hover{background:var(--bg-hover)}
.meet-mini em{font-style:normal;font:600 11.5px var(--mono);color:var(--c);flex:0 0 auto}
.ms{--c:var(--gold);display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r-sm);font-weight:600;font-size:13px;
  background:color-mix(in srgb,var(--c) 11%,var(--bg));color:var(--text);margin-top:auto}

/* phase slide */
.lib{display:grid;grid-template-columns:1fr 1.08fr;gap:32px;align-items:start}
.lib-info{display:flex;flex-direction:column;gap:14px;padding-top:4px;min-width:0}
.lib-head{display:flex;gap:18px;align-items:center}
.lib-head .tag{font-size:16px;color:var(--muted);margin-top:2px}
.lib-num{font-weight:600;color:var(--muted);font-size:13px;letter-spacing:.04em}
.desc{font-size:17px}
.meets{list-style:none;display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:var(--r-lg);padding:6px}
.meets li{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:var(--r)}
.meets li:hover{background:var(--bg-hover)}
.meets li b{display:block;font-size:15px;font-weight:600}
.meets li small{display:block;font-size:13.5px;color:var(--text-2);line-height:1.5;margin-top:2px}
.lib-side{display:flex;flex-direction:column;gap:18px;min-width:0}

/* stage / demo: mirip kartu preview demo di handbook */
.stage{position:relative;padding:44px 20px 20px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;min-width:0;
  background-image:radial-gradient(var(--border) 1px,transparent 1.2px);background-size:16px 16px;background-color:var(--bg)}
.stage small{color:var(--muted);font-size:12.5px}
.stage .err{color:var(--red);font-weight:600}
.stage-label{position:absolute;top:0;left:0;right:0;padding:8px 14px;font:500 11.5px var(--mono);color:var(--muted);text-align:left;
  border-bottom:1px solid var(--border);background:var(--bg-side);border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;align-items:center;gap:6px}
.stage-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin .8s linear infinite}
.rd{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.big-num{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--text)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:var(--gray-bg)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-weight:500;font-size:13px;color:var(--text-2)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:var(--shadow-sm)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.scard{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;text-align:left;min-width:0}
.scard .av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;color:var(--blue-text);font-weight:700;font-size:14px;background:var(--blue-bg)}
.scard b{display:block;font-size:13.5px;font-weight:600}
.scard small{display:block;font-size:12px}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--green-bg);color:var(--green);margin-left:auto}
.demo-input{flex:1;min-width:0;padding:8px 11px;border-radius:var(--r-sm);border:1px solid var(--border-2);font:500 14.5px var(--font);background:var(--bg);color:var(--text);outline:0}
.demo-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.form-row{display:flex;gap:8px;width:100%}
.tasks{list-style:none;display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--r);padding:4px;background:var(--bg)}
.tasks li{display:flex;gap:10px;align-items:center;border-radius:var(--r-sm);padding:6px 8px;font-weight:500;font-size:14px}
.tasks li:hover{background:var(--bg-hover)}
.tasks li.done span{text-decoration:line-through;color:var(--muted)}
.tasks li span{flex:1;min-width:0}
.tasks input{width:16px;height:16px;accent-color:var(--blue)}
.icon-x{border:0;background:transparent;border-radius:var(--r-sm);padding:2px 8px;font-weight:600;color:var(--muted)}
.icon-x:hover{background:var(--red-bg);color:var(--red)}
.users{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.pipeline{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px;text-align:left}
.pipe{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--border);font:500 13px var(--mono);color:var(--muted);transition:background .3s,color .3s}
.pipe i{width:20px;height:20px;flex:0 0 20px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:11px;background:var(--gray-bg)}
.pipe.run{color:var(--text);background:var(--gold-bg)}.pipe.run i{background:var(--gold-strong)}
.pipe.ok{color:var(--text);background:var(--green-bg)}.pipe.ok i{background:var(--green);color:var(--on-accent)}
.live{font:500 13.5px var(--mono);color:var(--green);background:var(--green-bg);padding:6px 12px;border-radius:var(--r-sm)}

/* flow steps */
.wsteps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wstep{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wstep em{font-style:normal;font:600 11.5px var(--mono);color:var(--blue)}
.wstep b{font-size:13.5px;font-weight:600;line-height:1.25}
.wstep small{font-size:12px;color:var(--muted);line-height:1.4}

/* jebakan */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.trap{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.trap-h{display:flex;gap:10px;align-items:center}
.trap-h h3{font-size:16.5px}
.trap p{font-size:14.5px}

/* ai */
.ai3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ai3 .box{--dot:var(--c);border-top:3px solid var(--c)}
.ai3 .box h3{color:var(--text)}
.golden{display:flex;gap:14px;align-items:center;padding:16px 20px;border-radius:var(--r-sm);background:var(--gold-bg)}
.golden p{font-size:18px;font-weight:600;color:var(--text)}

/* penilaian */
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-row .lbl{display:flex;justify-content:space-between;font-weight:500;font-size:14.5px}
.meter{height:8px;border-radius:999px;background:var(--gray-bg);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lvl{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.lvl b{display:block;font-size:15px;font-weight:600}
.lvl em{font-style:normal;font:600 11.5px var(--mono);color:var(--gold)}
.lvl small{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}

/* quiz */
.quiz{padding:28px;display:flex;flex-direction:column;gap:18px;max-width:780px;width:100%;margin:0 auto}
.qtext{font-size:21px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);font-weight:500;font-size:15px;color:var(--text);text-align:left;transition:background .15s,border-color .15s}
.opt code{font-size:13px;background:none;padding:0;color:var(--text)}
.opt:hover{background:var(--bg-hover);border-color:var(--border-2)}
.opt.right{background:var(--green-bg);border-color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qfeedback{font-weight:600;min-height:24px}

/* checklist: to-do block ala Notion */
.checks{display:flex;flex-direction:column;gap:0}
.check{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:var(--r-sm);font-weight:400;font-size:15px;cursor:pointer;color:var(--text)}
.check:hover{background:var(--bg-hover)}
.check input{appearance:none;-webkit-appearance:none;width:17px;height:17px;flex:0 0 17px;border-radius:3px;border:1.5px solid var(--text-2);cursor:pointer;display:grid;place-items:center;background:var(--bg)}
.check input:checked{background:var(--blue);border-color:var(--blue)}
.check input:checked::after{content:"✓";color:var(--on-accent);font-weight:800;font-size:12px;line-height:1}
.check:has(input:checked) span{color:var(--muted);text-decoration:line-through}

/* penutup */
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.doc{padding:14px;display:flex;gap:12px;align-items:center;min-width:0;text-decoration:none;transition:box-shadow .2s,transform .2s}
.doc:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.doc b{display:block;font-size:15px;font-weight:600}
.doc p{font-size:13.5px;line-height:1.4}

/* nav */
.nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border-radius:12px;z-index:50;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow-lg)}
.nav .nbtn{width:38px;height:38px;border-radius:8px;border:0;display:grid;place-items:center;color:var(--text-2);background:transparent;transition:background .15s}
.nav .nbtn:hover{background:var(--bg-hover);color:var(--text)}
.nav .nbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .nbtn.primary{background:var(--blue);color:var(--on-accent)}
.nav .nbtn.primary:hover{filter:brightness(1.08)}
.counter{font:500 13px var(--mono);min-width:64px;text-align:center;color:var(--text-2)}
.nav .sep{width:1px;height:22px;background:var(--border)}
.ico-sun{display:none}
:root[data-theme="dark"] .ico-sun{display:block}:root[data-theme="dark"] .ico-moon{display:none}

.overview{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 97%,transparent);backdrop-filter:blur(6px);padding:40px 24px;overflow:auto;display:none}
.overview.open{display:block}
.ov-grid{max-width:1120px;margin:20px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ov-item{padding:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px;color:var(--text);border-radius:var(--r)}
.ov-item:hover{background:var(--bg-hover)}
.ov-item.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.ov-head{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}

@media (max-width:1000px){
  .road{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wsteps{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){
  .cover,.two,.lib,.ai3{grid-template-columns:1fr}
  .hero-art{max-width:380px;order:-1}
  .stats{grid-template-columns:1fr}
  .stat{padding:14px 16px;border-right:0;border-bottom:1px solid var(--border)}
  .stat:last-child{border-bottom:0}
  .slide{padding:56px 16px 112px}
  .lib-head{gap:14px}
  .lib-head .clay.xl{--s:64px}
  .wrap{justify-content:flex-start}
  .wire{grid-template-columns:1fr;padding:12px}
  .wire-main{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wire-main>*{grid-column:span 2}
  .wire-main>.kp{grid-column:span 1}
  .wire-main>.kp:last-of-type{grid-column:span 2}
  .road,.tools,.cards,.levels{grid-template-columns:minmax(0,1fr)}
  .wsteps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage{padding:44px 12px 16px}
  .brand .crumb-wrap{display:none}
  .box{padding:18px}
  .quiz{padding:18px}
  .code-card pre{padding:10px 12px 14px}
  .fl.chip{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const fmt = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

};

 {id:1,key:'phase-1',name:'Foundations',color:'var(--blue)',icon:'layers',meetings:'1–3',topics:'React, JSX, Components, Props',

}

function StudentList({ students }) {

 {id:2,key:'phase-2',name:'Interactivity',color:'var(--gold)',icon:'zap',meetings:'4–6',topics:'Events, State, Forms, CRUD',

const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className='slide';sec.dataset.index=i;sec.setAttribute('aria-label',s.title);
  sec.innerHTML=s.html;
  if(s.phase){ sec.querySelector('.snippet').textContent=s.phase.code; }

const els = [...deck.children];
let cur = 0;

function go(n){
  n=Math.max(0,Math.min(els.length-1,n));
  if(n!==cur) resetSlide(cur);
  els.forEach((el,i)=>{el.classList.toggle('active',i===n);el.classList.toggle('left',i<n);});
  cur=n;
  document.getElementById('counter').textContent=`${n+1} / ${els.length}`;
  document.getElementById('progress').style.width=`${(n+1)/els.length*100}%`;
  els[n].scrollTop=0;
  // animasi bar penilaian saat slide tampil
  els.forEach((el,i)=>el.querySelectorAll('.meter i[data-w]').forEach(m=>m.style.width=i===n?m.dataset.w+'%':'0'));
  document.getElementById('crumb').textContent=slides[n].title;
  history.replaceState(null,'','#'+(n+1));
  renderOverview();
}

function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('hsi-theme',t);}catch(e){}   // kunci sama dengan handbook
}
document.getElementById('btnTheme').onclick=toggleTheme;
document.getElementById('btnPrev').onclick=()=>go(cur-1);
document.getElementById('btnNext').onclick=()=>go(cur+1);
document.getElementById('btnFull').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go],[data-goto]');
  if(g){go(g.dataset.goto?IDX[g.dataset.goto]:+g.dataset.go);closeOverview();}
  const c=e.target.closest('.copy');
  if(c){const code=c.closest('.code-card').querySelector('code').textContent;
    navigator.clipboard?.writeText(code).then(()=>{c.textContent='Tersalin ✓';setTimeout(()=>c.textContent='Salin',1500)}).catch(()=>{c.textContent='Gagal ✕';setTimeout(()=>c.textContent='Salin',1500)});}
  const d=e.target.closest('.btn-demo'); if(d) runDemo(d.closest('.stage'));
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input:not([type=checkbox]),select,textarea,[contenteditable]')) return;
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(els.length-1);
  else if(e.key.toLowerCase()==='o')toggleOverview();
  else if(e.key.toLowerCase()==='f')document.getElementById('btnFull').click();
  else if(e.key.toLowerCase()==='t')toggleTheme();
  else if(e.key==='Escape')closeOverview();
});

deck.addEventListener('touchstart',e=>{
  if(e.target.closest('.stage,pre,.code-card,.mini,.wire')){sx=null;return;}

    box.querySelectorAll('.opt').forEach(o=>{if(q.opts[+o.dataset.k]===q.a)o.classList.add('right');});

    const fb=box.querySelector('#qfb');

  {id:3,name:'Hafiz Maulana',kelas:'X',skill:'UI Design',aktif:false},
  {id:4,name:'Bilal Akbar',kelas:'XI',skill:'React',aktif:true},
  {id:5,name:'Umar Hakim',kelas:'XII',skill:'Git & GitHub',aktif:false}
];

const COMPONENTS={
  counter(){
    function Counter(){
      const [count,setCount]=React.useState(0);
      return R('div',{className:'rd'},
        R('div',{className:'big-num'},count),
        R('div',{className:'row',style:{justifyContent:'center'}},
          R('button',{className:'cbtn',style:{'--c':'var(--gold)'},onClick:()=>setCount(count+1)},'Count: '+count),
          R('button',{className:'cbtn ghost sm',onClick:()=>setCount(0)},'Reset')),
        R('small',null,`state count = ${count} → React menggambar ulang tampilan`));
    }
    return Counter;
  },
  props(){
    function StudentCard({name,kelas,skill,aktif}){
      return R('div',{className:'scard'},
        R('span',{className:'av'},name[0]),
        R('span',{style:{minWidth:0}},R('b',null,name),R('small',null,`Kelas ${kelas} · ${skill}`)),
        aktif && R('span',{className:'badge'},'Aktif'));
    }
    function StudentDirectory(){
      const [kelas,setKelas]=React.useState('Semua');
      const list=STUDENTS.filter(s=>kelas==='Semua'||s.kelas===kelas);
      return R('div',{className:'rd'},
        R('div',{className:'seg'},['Semua','X','XI','XII','XIII'].map(k=>R('button',{key:k,className:k===kelas?'on':'',onClick:()=>setKelas(k)},k))),
        list.length===0
          ? R('p',{style:{fontSize:'15px'}},'Belum ada siswa di kelas ini.')
          : R('div',{className:'cards'},list.map(s=>R(StudentCard,{key:s.id,...s}))),
        R('small',null,'Satu komponen StudentCard dipakai berulang lewat map() + props. Coba kelas XIII: conditional rendering.'));
    }
    return StudentDirectory;
  },
  tasks(){
    function TaskManager(){
      const [tasks,setTasks]=React.useState([
        {id:1,text:'Install Node.js & Vite',done:true},
        {id:2,text:'Buat komponen StudentCard',done:false}
      ]);
      const [text,setText]=React.useState('');
      const [error,setError]=React.useState('');
      const addTask=e=>{
        e.preventDefault();
        if(!text.trim()){setError('Tugas tidak boleh kosong');return;}
        setTasks(prev=>[...prev,{id:Date.now(),text:text.trim(),done:false}]);
        setText('');setError('');
      };
      const toggle=id=>setTasks(prev=>prev.map(t=>t.id===id?{...t,done:!t.done}:t));
      const remove=id=>setTasks(prev=>prev.filter(t=>t.id!==id));
      const selesai=tasks.filter(t=>t.done).length;
      return R('div',{className:'rd'},
        R('form',{className:'form-row',onSubmit:addTask},
          R('input',{className:'demo-input',value:text,placeholder:'Tugas baru, mis. Belajar useState',onChange:e=>setText(e.target.value)}),
          R('button',{className:'cbtn sm',style:{'--c':'var(--gold)'}},'Tambah')),
        error && R('small',{className:'err'},error),
        R('ul',{className:'tasks'},tasks.map(t=>R('li',{key:t.id,className:t.done?'done':''},
          R('input',{type:'checkbox',checked:t.done,onChange:()=>toggle(t.id),'aria-label':'Selesai'}),
          R('span',null,t.text),
          R('button',{className:'icon-x',onClick:()=>remove(t.id),'aria-label':'Hapus'},'✕')))),
        R('small',null,`${selesai} / ${tasks.length} selesai · dihitung dengan filter(), tanpa state tambahan`));
    }
    return TaskManager;
  },
  api(){
    function ApiExplorer(){
      const [users,setUsers]=React.useState([]);
      const [status,setStatus]=React.useState('loading');
      const [req,setReq]=React.useState({n:0,bad:false});
      React.useEffect(()=>{
        const ctrl=new AbortController();
        setStatus('loading');
        const url=req.bad?'https://jsonplaceholder.typicode.com/alamat-salah':'https://jsonplaceholder.typicode.com/users?_limit=4';
        fetch(url,{signal:ctrl.signal})
          .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
          .then(d=>{setUsers(d);setStatus('success');})
          .catch(e=>{if(e.name!=='AbortError')setStatus('error');});
        return ()=>ctrl.abort(); // cleanup saat komponen hilang / request berganti
      },[req]);
      return R('div',{className:'rd'},
        R('span',{className:'chip',style:{'--c':status==='error'?'var(--red)':status==='success'?'var(--green)':'var(--gold)'}},'status: "'+status+'"'),
        status==='loading' && R('div',{className:'spinner'}),
        status==='error' && R('p',{className:'err'},'Terjadi kesalahan saat memuat data.'),
        status==='success' && R('div',{className:'users'},users.map(u=>R('div',{key:u.id,className:'scard'},
          R('span',{className:'av',style:{background:'var(--green-bg)',color:'var(--green)'}},u.name[0]),
          R('span',{style:{minWidth:0}},R('b',null,u.name),R('small',null,u.email.toLowerCase()))))),
        R('div',{className:'row',style:{justifyContent:'center'}},
          R('button',{className:'cbtn sm',style:{'--c':'var(--green)'},onClick:()=>setReq({n:req.n+1,bad:false})},'↻ Muat ulang'),
          R('button',{className:'cbtn ghost sm',onClick:()=>setReq({n:req.n+1,bad:true})},'Simulasi error')),
        R('small',null,'Data asli dari jsonplaceholder.typicode.com · loading → success / error'));
    }
    return ApiExplorer;
  },
  deploy(){
    const STEPS=['npm run build','dist/ siap (HTML, CSS, JS)','git push ke GitHub','Vercel build & deploy','Aplikasi online 🎉'];
    function DeployFlow(){
      const [step,setStep]=React.useState(-1);
      React.useEffect(()=>{
        if(step<0||step>=STEPS.length)return;
        const t=setTimeout(()=>setStep(s=>s+1),850);
        return ()=>clearTimeout(t);
      },[step]);
      const done=step>=STEPS.length;
      return R('div',{className:'rd'},
        R('div',{className:'pipeline'},STEPS.map((s,i)=>R('div',{key:s,className:'pipe '+(i<step?'ok':i===step?'run':'')},
          R('i',null,i<step?'✓':i+1),s))),
        done && R('span',{className:'live'},'🌐 hsi-school-dashboard.vercel.app (contoh)'),
        R('button',{className:'cbtn sm',style:{'--c':'var(--red)'},disabled:step>=0&&!done,onClick:()=>setStep(0)},done?'↺ Deploy ulang':'🚀 Deploy'),
        R('small',null,'Simulasi alur deploy · useEffect + setTimeout menjalankan tiap langkah'));
    }
    return DeployFlow;
  }
};

async function runDemo(st){
  const make=COMPONENTS[st.dataset.demo]; if(!make||st.dataset.loading)return;
  st.dataset.loading='1';
  const token=st._token=(st._token||0)+1;
  st.innerHTML='<span class="stage-label">Demo langsung · React</span><div class="spinner"></div><small>Memuat React…</small>';
  try{
    await loadReact();
    if(st._token!==token)return;           // sudah pindah slide saat memuat
    st.innerHTML='<span class="stage-label">Demo langsung · React</span>';
    const mount=document.createElement('div');mount.style.width='100%';st.append(mount);
    const root=ReactDOM.createRoot(mount);
    root.render(React.createElement(make()));
    st.dataset.ran='1';
    st._cleanup=()=>root.unmount();
  }catch(err){
    if(st._token!==token)return;
    console.error(err);
    st.innerHTML='<span class="stage-label">Demo langsung · React</span><p class="err">Gagal memuat demo 😢</p><small>Pastikan perangkat terhubung ke internet, lalu coba lagi.</small>';
    const b=document.createElement('button');b.className='cbtn sm';b.textContent='Coba lagi';
    b.onclick=()=>{delete st.dataset.loading;runDemo(st);};st.append(b);
  }
}
/* Unmount komponen saat meninggalkan slide: hindari timer & request yatim */
function resetStage(st){
  st._token=(st._token||0)+1;
  if(st._cleanup){try{st._cleanup();}catch(e){console.warn(e);}st._cleanup=null;}
  if(st.dataset.ran||st.dataset.loading) st.innerHTML=st._initial;
  delete st.dataset.loading;delete st.dataset.ran;
}
function resetSlide(i){ els[i]?.querySelectorAll('.stage[data-demo]').forEach(resetStage); }

/* start */
const start=parseInt(location.hash.slice(1));
go(Number.isFinite(start)?start-1:0);
</script>
</body>
