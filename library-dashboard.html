<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard dengan Library JS · HSI Boarding School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5E9; --bg2:#FFFDF8; --ink:#1B2A4A; --muted:#6A6F80; --card:#FFFDF7;
  --shadow-dark:rgba(176,146,92,.26); --shadow-light:rgba(255,255,255,.95);
  --accent:#1F4FA0; --gold:#E0A82E; --blue-soft:#5B8DEF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 8% 0%,#FFF1CF 0%,transparent 60%),
             radial-gradient(1000px 700px at 100% 100%,#DDE9FF 0%,transparent 60%),
             linear-gradient(160deg,var(--bg2),var(--bg));
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* ===== Clay primitives ===== */
.clay-card{
  background:var(--card);border-radius:32px;
  box-shadow:16px 16px 32px var(--shadow-dark),-10px -10px 24px var(--shadow-light),
             inset 4px 4px 10px rgba(255,255,255,.9),inset -4px -4px 10px rgba(176,146,92,.1);
}
.clay{
  --s:64px;--c:#1F4FA0;
  width:var(--s);height:var(--s);flex:0 0 var(--s);
  border-radius:calc(var(--s)*.34);position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 45%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 82%,#000) 125%);
  box-shadow:
    inset calc(var(--s)*-.07) calc(var(--s)*-.09) calc(var(--s)*.16) rgba(0,0,0,.2),
    inset calc(var(--s)*.07) calc(var(--s)*.07) calc(var(--s)*.14) rgba(255,255,255,.6),
    0 calc(var(--s)*.2) calc(var(--s)*.34) calc(var(--s)*-.1) color-mix(in srgb,var(--c) 75%,transparent);
}
.clay::after{
  content:"";position:absolute;top:11%;left:15%;width:34%;height:17%;border-radius:50%;
  background:rgba(255,255,255,.6);filter:blur(1.5px);transform:rotate(-22deg);
}
.clay svg{width:52%;height:52%;color:#fff;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 calc(var(--s)*.03) 0 rgba(0,0,0,.16));position:relative;z-index:1}
.clay.sm{--s:44px}.clay.md{--s:58px}.clay.lg{--s:84px}.clay.xl{--s:110px}
.clay.btn{border:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.clay.btn:hover{transform:translateY(-6px) rotate(-6deg) scale(1.06)}

.cbtn{
  --c:var(--accent);border:0;border-radius:18px;padding:12px 22px;font-weight:800;font-size:15px;color:#fff;
  background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 70%);
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.18),inset 3px 3px 8px rgba(255,255,255,.5),0 10px 18px -8px color-mix(in srgb,var(--c) 80%,transparent);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.cbtn:hover{transform:translateY(-2px)}.cbtn:active{transform:scale(.95)}
.cbtn.sm{padding:8px 14px;font-size:13px;border-radius:14px}
.cbtn.ghost{--c:#EFE4CC;color:var(--ink)}
.cbtn.gold{--c:var(--gold);color:#3A2A05}

.chip{
  --c:#1F4FA0;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;
  color:color-mix(in srgb,var(--c) 60%,#000);background:color-mix(in srgb,var(--c) 20%,#fff);
  box-shadow:inset 2px 2px 4px rgba(255,255,255,.8),inset -2px -2px 4px color-mix(in srgb,var(--c) 25%,transparent);
  border:0;text-decoration:none;
}
button.chip,a.chip{transition:transform .2s}button.chip:hover,a.chip:hover{transform:translateY(-2px)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:14px;background:#fff;font-weight:700;font-size:13px;color:var(--muted);
  box-shadow:4px 4px 10px var(--shadow-dark),-4px -4px 10px var(--shadow-light)}
.ic{font:600 13px 'JetBrains Mono',monospace;background:#F3EAD6;padding:2px 7px;border-radius:7px;color:var(--ink);white-space:nowrap}

/* ===== Deck ===== */
.progress{position:fixed;top:0;left:0;height:6px;background:linear-gradient(90deg,#1F4FA0,#5B8DEF,#E0A82E,#F5C95B);
  border-radius:0 6px 6px 0;transition:width .5s cubic-bezier(.22,1,.36,1);z-index:60}
.deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:56px 24px 120px;
  opacity:0;visibility:hidden;transform:translateX(60px) scale(.98);
  transition:opacity .45s ease,transform .55s cubic-bezier(.22,1,.36,1),visibility .45s;
}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.left{transform:translateX(-60px) scale(.98)}
.wrap{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:28px}
h1{font-size:clamp(34px,5.6vw,64px);font-weight:900;line-height:1.05;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,44px);font-weight:900;line-height:1.1;letter-spacing:-.01em}
h3{font-size:21px;font-weight:900}
h4{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
p{font-size:18px;line-height:1.6;color:var(--muted)}
.grad{background:linear-gradient(90deg,#1F4FA0,#3B7BE0 45%,#D99A1E);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-weight:900;color:#B7831A;letter-spacing:.12em;text-transform:uppercase;font-size:14px}

/* brand */
.brandbar{display:flex;align-items:center;gap:14px}
.brandbar img{width:62px;height:auto;filter:drop-shadow(0 6px 10px rgba(176,146,92,.35))}
.brandbar b{display:block;font-size:17px;font-weight:900}
.brandbar small{color:var(--muted);font-weight:700;font-size:13px}
.foot-brand{position:fixed;left:20px;bottom:30px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;color:var(--muted);z-index:40}
.foot-brand img{width:22px}

/* cover */
.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.cloud{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;justify-items:center;padding:30px}
.cloud .clay{animation:bob 4s ease-in-out infinite}
.cloud .clay:nth-child(3n){animation-delay:-1.3s}.cloud .clay:nth-child(3n+1){animation-delay:-2.6s}
@keyframes bob{50%{translate:0 -10px}}

/* grids */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box{padding:28px;display:flex;flex-direction:column;gap:14px}
.box ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.box li{font-size:16px;line-height:1.5;color:var(--muted);padding-left:26px;position:relative}
.box li::before{content:"";position:absolute;left:4px;top:7px;width:12px;height:12px;border-radius:50%;
  background:var(--dot,#1F4FA0);box-shadow:inset -2px -2px 3px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.6)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* wireframe target */
.wire{display:grid;grid-template-columns:160px 1fr;gap:14px;padding:20px}
.wire-main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.w{--c:#1F4FA0;border:2px dashed color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 9%,#fff);
  border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;min-height:72px}
.w small{font-weight:700;color:var(--muted);font-size:13px;line-height:1.4}
.w .row{gap:6px}
.w-side{--c:#1B2A4A;justify-content:flex-start}
.span3{grid-column:span 3}.span2{grid-column:span 2}

/* library slide */
.lib{display:grid;grid-template-columns:1fr 1.08fr;gap:32px;align-items:start}
.lib-info{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.lib-head{display:flex;gap:22px;align-items:center}
.lib-head .tag{font-size:17px;font-weight:700;color:var(--muted);margin-top:4px}
.lib-num{font-weight:900;color:var(--muted);font-size:14px;letter-spacing:.1em}
.desc{font-size:18px}
.uses{list-style:none;display:flex;flex-direction:column;gap:10px}
.uses li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:16px;background:#fff;padding:12px 16px;border-radius:18px;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.uses li::before{content:"";width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:var(--c);
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.6)}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.lib-side{display:flex;flex-direction:column;gap:20px;min-width:0}

.code-card{background:#1B2A4A;border-radius:26px;overflow:hidden;
  box-shadow:14px 14px 30px rgba(27,42,74,.32),inset 3px 3px 8px rgba(255,255,255,.08),inset -3px -3px 8px rgba(0,0,0,.4)}
.code-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0 20px;color:#A9B7D6;font:600 13px 'JetBrains Mono',monospace}
.dots{display:flex;gap:6px;margin-right:10px}.dots i{width:11px;height:11px;border-radius:50%;background:#FF7A6B}
.dots i:nth-child(2){background:#F5C95B}.dots i:nth-child(3){background:#7BDB9E}
.code-card pre{padding:14px 20px 20px;overflow:auto;max-height:280px}
.code-card.tall pre{max-height:470px}
.code-card code{font:400 13.5px/1.65 'JetBrains Mono',monospace;color:#EEF2FF;white-space:pre}
.copy{background:#2C3E66;color:#F5D98B;border:0;border-radius:10px;padding:6px 12px;font-weight:800;font-size:12px}

.stage{position:relative;padding:22px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.stage small{color:var(--muted);font-weight:700}
.stage .err{color:#C2410C;font-weight:800}
.stage-label{position:absolute;top:14px;left:20px;font-weight:900;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.spinner{width:42px;height:42px;border-radius:50%;border:5px solid #EFE4CC;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* demo bits */
.tip{position:absolute;top:0;left:0;background:#1B2A4A;color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px;
  pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
.tip.fx{position:fixed;white-space:normal;max-width:250px;text-align:left;z-index:100;line-height:1.4;font-size:13px}
.demo-input{width:100%;max-width:340px;padding:12px 16px;border-radius:16px;border:0;font:700 15px 'Nunito';background:#fff;color:var(--ink);
  box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -3px -3px 8px var(--shadow-light)}
.promo{width:100%;border-radius:20px;overflow:hidden}
.promo .swiper-slide{min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;padding:20px 22px 34px;color:#fff;text-align:left;border-radius:20px}
.promo .swiper-slide b{font-size:22px;font-weight:900;line-height:1.15}
.promo .swiper-slide span{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.promo .swiper-pagination-bullet-active{background:#fff}
.chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;width:100%}
.chart-wrap{position:relative;width:100%;height:220px}
.tab-wrap{width:100%;text-align:left}
.tomsel-wrap{width:100%;max-width:400px;text-align:left}
.mini-kpis{display:flex;justify-content:space-between;gap:10px;width:100%}

/* integrasi */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:16px;align-items:center}
.flow .col{display:flex;flex-direction:column;gap:12px}
.flow .col h4{margin:0 0 2px}
.node{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:18px;font-weight:800;border:0;text-align:left;color:var(--ink);
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.node small{display:block;font-weight:700;color:var(--muted);font-size:13px}
.arrow{font-size:30px;color:var(--gold);font-weight:900;text-align:center}
.hub{padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hub p{font-size:15px}

/* jebakan */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.trap{padding:22px;display:flex;flex-direction:column;gap:10px}
.trap .bad{color:#B4441E;font-weight:800;font-size:15px;line-height:1.45}
.trap .good{color:#1F6F4A;font-weight:700;font-size:15px;line-height:1.5}
.trap p{font-size:15px}

/* dashboard demo */
.dash-stage{min-height:420px}
.dash-stage.ran{align-items:stretch;justify-content:flex-start;text-align:left;padding:16px}
.dash{display:grid;grid-template-columns:190px 1fr;gap:16px;width:100%}
.dash-side{background:linear-gradient(170deg,#1F4FA0,#163A78);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:18px}
.dash-side .brand{display:flex;align-items:center;gap:10px;font-weight:900;line-height:1.1}
.dash-side .brand img{width:38px;background:#fff;border-radius:10px;padding:3px}
.dash-side nav{display:flex;flex-direction:column;gap:6px}
.dash-side nav span{padding:9px 12px;border-radius:12px;font-weight:800;font-size:14px;opacity:.75}
.dash-side nav .on{background:rgba(255,255,255,.16);opacity:1;box-shadow:inset 4px 0 0 var(--gold)}
.dash-side .sch{margin-top:auto;color:#F5D98B;font-weight:800;font-size:12px}
.dash-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dash-head small{color:var(--muted);font-weight:700;font-size:13px}
.dash-filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dash-filter .demo-input{width:190px;padding:10px 14px;font-size:14px}
.dsel{width:240px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{--c:#1F4FA0;position:relative;background:#fff;border-radius:18px;padding:14px 16px 14px 20px;display:flex;flex-direction:column;gap:2px;cursor:help;outline:none;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.kpi::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--c)}
.kpi:focus-visible{outline:3px solid var(--gold)}
.kpi span{font-weight:800;font-size:13px;color:var(--muted)}
.kpi b{font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{position:absolute;top:10px;right:12px;font-style:normal;color:var(--gold);font-weight:900}
.dash-row{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}
.dcard{background:#fff;border-radius:18px;padding:14px;min-width:0;box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.dcard h5{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.dcard .cw{position:relative;height:200px}
.dcard .promo{height:100%}
.dcard .promo .swiper-slide{min-height:220px}
.tabulator{border-radius:12px;font-size:14px;font-family:inherit}

/* tugas */
.task{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:start}
.check{list-style:none;display:flex;flex-direction:column;gap:8px}
.box .check li{padding-left:0}.box .check li::before{display:none}
.check label{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15px;line-height:1.4;color:var(--ink);background:#fff;padding:10px 14px;border-radius:14px;cursor:pointer;
  box-shadow:4px 4px 10px var(--shadow-dark),-4px -4px 10px var(--shadow-light)}
.check input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:0 0 18px}
.check input:checked+span{text-decoration:line-through;color:var(--muted)}
.meter{height:12px;border-radius:99px;background:#EFE4CC;overflow:hidden;box-shadow:inset 2px 2px 4px rgba(176,146,92,.3)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}

/* quiz */
.quiz{padding:30px;display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
.qtext{font-size:22px;font-weight:900;color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:20px;background:#fff;font-weight:800;font-size:16px;color:var(--ink);text-align:left;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light);transition:transform .2s}
.opt:hover{transform:translateY(-3px)}
.opt.right{background:#DFF5E6;box-shadow:inset 3px 3px 8px rgba(80,170,110,.35)}
.opt.wrong{background:#FDE6DD;box-shadow:inset 3px 3px 8px rgba(194,65,12,.25)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qfeedback{font-weight:800;min-height:24px}

/* nav */
.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:26px;z-index:50;
  background:rgba(255,253,247,.92);backdrop-filter:blur(10px)}
.nav .nbtn{width:46px;height:46px;border-radius:16px;border:0;display:grid;place-items:center;color:var(--ink);background:var(--card);
  box-shadow:5px 5px 12px var(--shadow-dark),-5px -5px 12px var(--shadow-light);transition:transform .2s}
.nav .nbtn:active{transform:scale(.92);box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -3px -3px 8px var(--shadow-light)}
.nav .nbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nav .nbtn.primary{background:var(--accent);color:#fff;box-shadow:inset -3px -4px 8px rgba(0,0,0,.2),inset 3px 3px 8px rgba(255,255,255,.4),0 8px 16px -6px var(--accent)}
.counter{font-weight:900;min-width:70px;text-align:center;font-size:15px}

.overview{position:fixed;inset:0;z-index:70;background:rgba(251,245,233,.96);backdrop-filter:blur(6px);padding:40px 24px;overflow:auto;display:none}
.overview.open{display:block}
.ov-grid{max-width:1120px;margin:20px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.ov-item{border:0;padding:18px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:800;font-size:15px;color:var(--ink);border-radius:24px}
.ov-item.cur{outline:3px solid var(--gold)}
.ov-head{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}

.hint{color:var(--muted);font-weight:700;font-size:14px}
kbd{font:700 12px 'JetBrains Mono';background:#fff;padding:3px 8px;border-radius:8px;box-shadow:2px 2px 5px var(--shadow-dark)}

@media (max-width:860px){
  .cover,.two,.lib,.task,.chart-grid,.dash,.dash-row,.wire{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}
  .wire-main{grid-template-columns:1fr}.span3,.span2{grid-column:auto}
  .cloud{grid-template-columns:repeat(4,1fr);gap:14px;padding:10px}
  .cloud .clay{--s:56px}
  .slide{padding:40px 16px 120px}
  .lib-head .clay.xl{--s:84px}
  .wrap{justify-content:flex-start}
  .kpis{grid-template-columns:1fr}
  .dash-side nav{flex-direction:row;flex-wrap:wrap}
  .dash-filter,.dash-filter .demo-input,.dsel{width:100%}
  .mini-kpis{flex-direction:column}
  .foot-brand{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<main class="deck" id="deck"></main>

<div class="foot-brand"><img src="logo-color.png" alt="">HSI Boarding School · Coders Club</div>

const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className='slide';sec.dataset.index=i;sec.setAttribute('aria-label',s.title);
  sec.innerHTML=s.html;
  if(s.lib){ sec.querySelector('.snippet').textContent=s.lib.code; }
  sec.querySelectorAll('[data-code]').forEach(c=>c.textContent=CODES[c.dataset.code]);
  deck.appendChild(sec);

const els = [...deck.children];
let cur = 0;

function go(n){
  n=Math.max(0,Math.min(els.length-1,n));
  els.forEach((el,i)=>{el.classList.toggle('active',i===n);el.classList.toggle('left',i<n);});
  cur=n;
  document.getElementById('counter').textContent=`${n+1} / ${els.length}`;
  document.getElementById('progress').style.width=`${(n+1)/els.length*100}%`;
  els[n].scrollTop=0;
  history.replaceState(null,'','#'+(n+1));
  SWIPERS.forEach(s=>{if(s.destroyed||!s.autoplay)return;s.el.closest('.slide')===els[n]?s.autoplay.start():s.autoplay.stop();});
  document.querySelectorAll('.tip.fx').forEach(t=>t.style.opacity=0);
  renderOverview();
}

document.getElementById('btnPrev').onclick=()=>go(cur-1);
document.getElementById('btnNext').onclick=()=>go(cur+1);
document.getElementById('btnFull').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);closeOverview();}
  const c=e.target.closest('.copy');
  if(c){const code=c.closest('.code-card').querySelector('code').textContent;
    navigator.clipboard?.writeText(code).then(()=>{c.textContent='Tersalin ✓';setTimeout(()=>c.textContent='Salin',1500)}).catch(()=>{});}
  const d=e.target.closest('.btn-demo'); if(d) runDemo(d.closest('.stage'));
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea,[contenteditable],.ts-control')) return;
  if(document.querySelector('.swal2-container')) return;
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(els.length-1);
  else if(e.key.toLowerCase()==='o')toggleOverview();
  else if(e.key.toLowerCase()==='f')document.getElementById('btnFull').click();
  else if(e.key==='Escape')closeOverview();
});
// swipe
let sx=null,sy=null;
deck.addEventListener('touchstart',e=>{
  if(e.target.closest('.stage,pre,.code-card')){sx=null;return;}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
deck.addEventListener('touchend',e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) go(cur+(dx<0?1:-1)); sx=null;});

}

  });
}

const cache={};
function loadScript(src){return cache[src]??=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Gagal memuat '+src));document.head.appendChild(s);});}
function loadCSS(href){if(cache[href])return;cache[href]=1;const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l);}
const h=(tag,props={},kids=[])=>{const e=Object.assign(document.createElement(tag),props);kids.forEach(k=>e.append(k));return e;};
const btn=(txt,color,cls='cbtn')=>{const b=h('button',{className:cls,textContent:txt});if(color)b.style.setProperty('--c',color);return b;};

  swiper:{css:[JD+'swiper@11/swiper-bundle.min.css'],js:[JD+'swiper@11/swiper-bundle.min.js']},
  tomselect:{css:[JD+'tom-select@2/dist/css/tom-select.css'],js:[JD+'tom-select@2/dist/js/tom-select.complete.min.js']},
  flatpickr:{css:[JD+'flatpickr@4/dist/flatpickr.min.css'],js:[JD+'flatpickr@4/dist/flatpickr.min.js',JD+'flatpickr@4/dist/l10n/id.js']},

function makePromo(){
  const wrap=h('div',{className:'swiper-wrapper'});
  PROMOS.forEach(p=>{const s=h('div',{className:'swiper-slide'},[h('span',{textContent:p.tag}),h('b',{textContent:p.title})]);s.style.background=p.bg;wrap.append(s);});
  const pag=h('div',{className:'swiper-pagination'});
  const el=h('div',{className:'swiper promo'},[wrap,pag]);
  return {el,pag};
}
function startSwiper(el,pag){
  const sw=new Swiper(el,{loop:true,grabCursor:true,spaceBetween:12,autoplay:{delay:3000,disableOnInteraction:false},pagination:{el:pag,clickable:true}});
  SWIPERS.push(sw);return sw;
}
// tooltip Floating UI (fixed, ikut scroll lewat autoUpdate)
function attachTip(m,target,text){
  const tip=h('div',{className:'tip fx',textContent:text});document.body.append(tip);
  let stop=null;
  const show=()=>{stop?.();tip.style.opacity=1;
    stop=m.autoUpdate(target,tip,()=>m.computePosition(target,tip,{strategy:'fixed',placement:'top',middleware:[m.offset(10),m.flip(),m.shift({padding:8})]})
      .then(({x,y})=>Object.assign(tip.style,{left:x+'px',top:y+'px'})));};
  const hide=()=>{tip.style.opacity=0;stop?.();stop=null;};
  target.addEventListener('mouseenter',show);target.addEventListener('focus',show);
  target.addEventListener('mouseleave',hide);target.addEventListener('blur',hide);
}

  dashboard:{libs:Object.keys(LIB_FILES),global:'FloatingUIDOM',run(st,m){

    let f=def();
    st.innerHTML=`<div class="dash">

        <div class="brand"><img src="logo-color.png" alt="">Kantin<br>HSI</div>
        <nav><span class="on">📊 Dashboard</span><span>🍱 Produk</span><span>🧾 Laporan</span></nav>

          <div class="kpi" tabindex="0" style="--c:#E0A82E" data-info="Jumlah transaksi yang tercatat di kasir sesuai filter."><span>Transaksi</span><b data-r="trx"></b><i>ⓘ</i></div>
          <div class="kpi" tabindex="0" style="--c:#E8735A" data-info="Produk dengan jumlah terjual paling banyak sesuai filter."><span>Terlaris</span><b data-r="top"></b><i>ⓘ</i></div>

        <div class="dcard"><h5>Rekap produk</h5><div data-r="tabel"></div></div>

    const $=k=>st.querySelector(`[data-r="${k}"]`);

    // Swiper + Floating UI: dibuat sekali
    const {el,pag}=makePromo();$('promo').append(el);startSwiper(el,pag);
    st.querySelectorAll('.kpi').forEach(k=>attachTip(m,k,k.dataset.info));

    // Chart.js: dibuat sekali, nanti cukup update()
    const cHari=new Chart($('cHari'),{type:'bar',data:{labels:[],datasets:[{label:'Omzet',data:[],backgroundColor:'#1F4FA0',hoverBackgroundColor:'#E0A82E',borderRadius:8}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>rupiah(c.parsed.y)}}},scales:{y:{ticks:{callback:v=>v/1000+'rb'}}}}});
    const cKat=new Chart($('cKat'),{type:'doughnut',data:{labels:Object.keys(KAT_COLOR),datasets:[{data:[],backgroundColor:Object.values(KAT_COLOR),borderWidth:3,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>' '+rupiah(c.parsed)}}}}});

    // Tabulator
    let tReady=false,lastRows=[];
    const tabel=new Tabulator($('tabel'),{data:[],layout:'fitColumns',pagination:true,paginationSize:5,placeholder:'Tidak ada data',

      {title:'Terjual',field:'terjual',sorter:'number',hozAlign:'center',minWidth:80},

      const val=t=>byId(t.pid).harga*t.qty;
      // KPI
      const qty={};tx.forEach(t=>qty[t.pid]=(qty[t.pid]||0)+t.qty);

        return {id:p.id,nama:p.nama,kategori:p.kategori,terjual:mine.reduce((s,t)=>s+t.qty,0),omzet:mine.reduce((s,t)=>s+val(t),0)};

      if(tReady)tabel.setData(lastRows);
    }
    function hapus(row){
      Swal.fire({title:`Hapus ${row.nama}?`,text:'Produk dan riwayat penjualannya akan hilang dari dashboard.',icon:'warning',showCancelButton:true,

        .then(r=>{if(!r.isConfirmed)return;
          prod.splice(prod.findIndex(p=>p.id===row.id),1);render();
          Swal.fire({toast:true,position:'top-end',icon:'success',title:`${row.nama} dihapus`,showConfirmButton:false,timer:2000,timerProgressBar:true});});

    const ts=new TomSelect($('kat'),{plugins:['remove_button'],placeholder:'Semua kategori',dropdownParent:'body',
      onChange:v=>{f.kategori=v;render();}});
    $('reset').onclick=()=>{f=def();fp.setDate([f.dari,f.sampai]);ts.clear(true);render();};

    render();
  }}
};

async function runDemo(st){
  const d=DEMOS[st.dataset.demo]; if(!d||st.dataset.loading)return;
  st.dataset.loading='1';
  st.innerHTML='<span class="stage-label">Demo langsung</span><div class="spinner"></div><small>Memuat library…</small>';
  try{
    const files=d.libs.map(k=>LIB_FILES[k]);
    files.forEach(x=>(x.css||[]).forEach(loadCSS));
    for(const x of files) for(const s of x.js) await loadScript(s);
    const mod=d.global?window[d.global]:null;
    if(d.global&&!mod) throw new Error('Global '+d.global+' tidak ditemukan');
    st.innerHTML='<span class="stage-label">Demo langsung</span>';
    d.run(st,mod);
  }catch(err){
    console.error(err);
    st.classList.remove('ran');
    st.innerHTML='<span class="stage-label">Demo langsung</span><p class="err">Gagal memuat demo 😢</p><small>Pastikan perangkat terhubung ke internet, lalu coba lagi.</small>';
    const b=btn('Coba lagi',null,'cbtn sm');b.onclick=()=>{delete st.dataset.loading;runDemo(st);};st.append(b);
  }
}
