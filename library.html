<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 Library Vanilla JS 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFFB; --bg2:#F6F1FF; --ink:#2B2D42; --muted:#6B6F8E; --card:#F8F9FF;
  --shadow-dark:rgba(116,124,188,.28); --shadow-light:rgba(255,255,255,.95);
  --accent:#7C6CFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 10% 0%,#FFE9F1 0%,transparent 60%),
             radial-gradient(1000px 700px at 100% 100%,#E3F4FF 0%,transparent 60%),
             linear-gradient(160deg,var(--bg2),var(--bg));
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}

/* ===== Clay primitives ===== */
.clay-card{
  background:var(--card);border-radius:32px;
  box-shadow:16px 16px 32px var(--shadow-dark),-10px -10px 24px var(--shadow-light),
             inset 4px 4px 10px rgba(255,255,255,.9),inset -4px -4px 10px rgba(116,124,188,.12);
}
.clay{
  --s:64px;--c:#7C6CFF;
  width:var(--s);height:var(--s);flex:0 0 var(--s);
  border-radius:calc(var(--s)*.34);position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 45%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 82%,#000) 125%);
  box-shadow:
    inset calc(var(--s)*-.07) calc(var(--s)*-.09) calc(var(--s)*.16) rgba(0,0,0,.2),
    inset calc(var(--s)*.07) calc(var(--s)*.07) calc(var(--s)*.14) rgba(255,255,255,.6),
    0 calc(var(--s)*.2) calc(var(--s)*.34) calc(var(--s)*-.1) color-mix(in srgb,var(--c) 75%,transparent);
}
.clay::after{
  content:"";position:absolute;top:11%;left:15%;width:34%;height:17%;border-radius:50%;
  background:rgba(255,255,255,.6);filter:blur(1.5px);transform:rotate(-22deg);
}
.clay svg{width:52%;height:52%;color:#fff;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 calc(var(--s)*.03) 0 rgba(0,0,0,.16));position:relative;z-index:1}
.clay.sm{--s:44px}.clay.md{--s:58px}.clay.lg{--s:84px}.clay.xl{--s:110px}
.clay.btn{border:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.clay.btn:hover{transform:translateY(-6px) rotate(-6deg) scale(1.06)}

.cbtn{
  --c:var(--accent);border:0;border-radius:18px;padding:12px 22px;font-weight:800;font-size:15px;color:#fff;
  background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 70%);
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.18),inset 3px 3px 8px rgba(255,255,255,.5),0 10px 18px -8px color-mix(in srgb,var(--c) 80%,transparent);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.cbtn:hover{transform:translateY(-2px)}.cbtn:active{transform:scale(.95)}
.cbtn.sm{padding:8px 14px;font-size:13px;border-radius:14px}
.cbtn.ghost{--c:#DDE1F7;color:var(--ink)}

.chip{
  --c:#7C6CFF;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;
  color:color-mix(in srgb,var(--c) 60%,#000);background:color-mix(in srgb,var(--c) 22%,#fff);
  box-shadow:inset 2px 2px 4px rgba(255,255,255,.8),inset -2px -2px 4px color-mix(in srgb,var(--c) 25%,transparent);
  border:0;
}
button.chip{transition:transform .2s}button.chip:hover{transform:translateY(-2px)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:14px;background:#fff;font-weight:700;font-size:13px;color:var(--muted);
  box-shadow:4px 4px 10px var(--shadow-dark),-4px -4px 10px var(--shadow-light)}

/* ===== Deck ===== */
.progress{position:fixed;top:0;left:0;height:6px;background:linear-gradient(90deg,#FF8FA3,#FFC24B,#5FD3B5,#7FB2FF,#B48CFF);
  border-radius:0 6px 6px 0;transition:width .5s cubic-bezier(.22,1,.36,1);z-index:60}
.deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:56px 24px 120px;
  opacity:0;visibility:hidden;transform:translateX(60px) scale(.98);
  transition:opacity .45s ease,transform .55s cubic-bezier(.22,1,.36,1),visibility .45s;
}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.left{transform:translateX(-60px) scale(.98)}
.wrap{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:28px}
h1{font-size:clamp(36px,6vw,68px);font-weight:900;line-height:1.05;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,44px);font-weight:900;line-height:1.1;letter-spacing:-.01em}
h3{font-size:21px;font-weight:900}
h4{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
p{font-size:18px;line-height:1.6;color:var(--muted)}
.grad{background:linear-gradient(90deg,#FF6F91,#FF9F43 40%,#7C6CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-weight:900;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:14px}

/* cover */
.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.cloud{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;justify-items:center;padding:30px}
.cloud .clay{animation:bob 4s ease-in-out infinite}
.cloud .clay:nth-child(3n){animation-delay:-1.3s}.cloud .clay:nth-child(3n+1){animation-delay:-2.6s}
@keyframes bob{50%{translate:0 -10px}}

/* grids */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.cat{padding:24px;display:flex;flex-direction:column;gap:14px}
.cat .libs{display:flex;flex-wrap:wrap;gap:8px}
.box{padding:28px;display:flex;flex-direction:column;gap:14px}
.box ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.box li{font-size:16px;line-height:1.5;color:var(--muted);padding-left:26px;position:relative}
.box li::before{content:"";position:absolute;left:4px;top:7px;width:12px;height:12px;border-radius:50%;
  background:var(--dot,#7C6CFF);box-shadow:inset -2px -2px 3px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.6)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* library slide */
.lib{display:grid;grid-template-columns:1fr 1.08fr;gap:32px;align-items:start}
.lib-info{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.lib-head{display:flex;gap:22px;align-items:center}
.lib-head .tag{font-size:17px;font-weight:700;color:var(--muted);margin-top:4px}
.lib-num{font-weight:900;color:var(--muted);font-size:14px;letter-spacing:.1em}
.desc{font-size:18px}
.uses{list-style:none;display:flex;flex-direction:column;gap:10px}
.uses li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:16px;background:#fff;padding:12px 16px;border-radius:18px;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.uses li::before{content:"";width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:var(--c);
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.6)}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.lib-side{display:flex;flex-direction:column;gap:20px;min-width:0}

.code-card{background:#2B2D42;border-radius:26px;overflow:hidden;
  box-shadow:14px 14px 30px rgba(43,45,66,.35),inset 3px 3px 8px rgba(255,255,255,.08),inset -3px -3px 8px rgba(0,0,0,.4)}
.code-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0 20px;color:#A9ACD0;font:600 13px 'JetBrains Mono',monospace}
.dots{display:flex;gap:6px;margin-right:10px}.dots i{width:11px;height:11px;border-radius:50%;background:#FF7A7A}
.dots i:nth-child(2){background:#FFCF4A}.dots i:nth-child(3){background:#7BDB7E}
.code-card pre{padding:14px 20px 20px;overflow:auto;max-height:280px}
.code-card code{font:400 13.5px/1.65 'JetBrains Mono',monospace;color:#E8E9FF;white-space:pre}
.copy{background:#3D4060;color:#E8E9FF;border:0;border-radius:10px;padding:6px 12px;font-weight:800;font-size:12px}

.stage{position:relative;padding:22px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.stage small{color:var(--muted);font-weight:700}
.stage .err{color:#D64560;font-weight:800}
.stage-label{position:absolute;top:14px;left:20px;font-weight:900;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.spinner{width:42px;height:42px;border-radius:50%;border:5px solid #DDE1F7;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* demo bits */
.demo-row{display:flex;gap:16px;align-items:flex-end;justify-content:center;min-height:120px;padding-top:40px}
.demo-box{--c:#7C6CFF;width:48px;height:48px;border-radius:16px;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 60%);
  box-shadow:inset -4px -5px 9px rgba(0,0,0,.2),inset 4px 4px 9px rgba(255,255,255,.6),0 10px 16px -8px var(--c)}
.demo-box.round{border-radius:50%}
.tip{position:absolute;top:0;left:0;background:#2B2D42;color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px;
  pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
.demo-input{width:100%;max-width:340px;padding:12px 16px;border-radius:16px;border:0;font:700 15px 'Nunito';background:#fff;color:var(--ink);
  box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -3px -3px 8px var(--shadow-light)}
.lenis-box{width:100%;height:220px;overflow:auto;border-radius:22px;background:#fff;box-shadow:inset 4px 4px 10px var(--shadow-dark),inset -4px -4px 10px var(--shadow-light)}
.lenis-box .item{margin:12px;padding:16px;border-radius:16px;font-weight:800;color:#fff;text-align:left}
.swiper-demo{width:100%;max-width:440px;border-radius:22px;overflow:hidden}
.swiper-demo .swiper-slide{height:170px;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;border-radius:22px}
.chart-wrap{position:relative;width:100%;height:220px}
.tab-wrap{width:100%;text-align:left}
.three-wrap{width:100%;height:240px;cursor:grab}
.tomsel-wrap{width:100%;max-width:380px;text-align:left}

/* recipes & quiz */
.recipe{padding:24px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;gap:-8px}
.stack .clay{margin-right:-10px;border:3px solid var(--card)}
.quiz{padding:30px;display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
.qtext{font-size:22px;font-weight:900;color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:20px;background:#fff;font-weight:800;font-size:16px;color:var(--ink);text-align:left;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light);transition:transform .2s}
.opt:hover{transform:translateY(-3px)}
.opt.right{background:#DFF8E6;box-shadow:inset 3px 3px 8px rgba(80,180,110,.35)}
.opt.wrong{background:#FFE3E8;box-shadow:inset 3px 3px 8px rgba(214,69,96,.3)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qfeedback{font-weight:800;min-height:24px}

/* nav */
.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:26px;z-index:50;
  background:rgba(248,249,255,.92);backdrop-filter:blur(10px)}
.nav .nbtn{width:46px;height:46px;border-radius:16px;border:0;display:grid;place-items:center;color:var(--ink);background:var(--card);
  box-shadow:5px 5px 12px var(--shadow-dark),-5px -5px 12px var(--shadow-light);transition:transform .2s}
.nav .nbtn:active{transform:scale(.92);box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -3px -3px 8px var(--shadow-light)}
.nav .nbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nav .nbtn.primary{background:var(--accent);color:#fff;box-shadow:inset -3px -4px 8px rgba(0,0,0,.2),inset 3px 3px 8px rgba(255,255,255,.4),0 8px 16px -6px var(--accent)}
.counter{font-weight:900;min-width:70px;text-align:center;font-size:15px}

.overview{position:fixed;inset:0;z-index:70;background:rgba(236,239,251,.96);backdrop-filter:blur(6px);padding:40px 24px;overflow:auto;display:none}
.overview.open{display:block}
.ov-grid{max-width:1120px;margin:20px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.ov-item{border:0;padding:18px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:800;font-size:15px;color:var(--ink);border-radius:24px}
.ov-item.cur{outline:3px solid var(--accent)}
.ov-head{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}

.hint{color:var(--muted);font-weight:700;font-size:14px}
kbd{font:700 12px 'JetBrains Mono';background:#fff;padding:3px 8px;border-radius:8px;box-shadow:2px 2px 5px var(--shadow-dark)}

@media (max-width:860px){
  .cover,.two,.lib{grid-template-columns:1fr}
  .cloud{grid-template-columns:repeat(4,1fr);gap:14px;padding:10px}
  .cloud .clay{--s:56px}
  .slide{padding:40px 16px 120px}
  .lib-head .clay.xl{--s:84px}
  .wrap{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<main class="deck" id="deck"></main>

<nav class="nav clay-card" aria-label="Navigasi slide">
  <button class="nbtn" id="btnOverview" title="Daftar slide (O)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
  <button class="nbtn" id="btnPrev" title="Sebelumnya (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="counter" id="counter">1 / 1</span>
  <button class="nbtn primary" id="btnNext" title="Berikutnya (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="nbtn" id="btnFull" title="Layar penuh (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>

<div class="overview" id="overview">
  <div class="ov-head"><h2>Daftar Slide</h2><button class="cbtn ghost" id="ovClose">Tutup ✕</button></div>
  <div class="ov-grid" id="ovGrid"></div>
</div>

<script>
/* ===================== IKON (SVG glyph) ===================== */
const ICONS = {
  bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6.5 3 8.5 3 8.5H3S6 15.5 6 9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  tooltip:'<rect x="3" y="3" width="18" height="12" rx="3.5"/><path d="M9 15l3 4 3-4"/><path d="M8 9h8"/>',
  slides:'<rect x="6.5" y="5" width="11" height="14" rx="2.5"/><path d="M3 8.5v7M21 8.5v7"/>',
  select:'<rect x="3" y="4" width="18" height="7" rx="2.5"/><path d="M14.5 6.8l1.7 1.6 1.7-1.6"/><path d="M6 15.5h9M6 19.5h6"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M8 3v4M16 3v4M3 10.5h18"/><path d="M8 15h.01M12 15h.01M16 15h.01"/>',
  zap:'<path d="M13 2.5L4.5 13.5H11l-1 8 8.5-11H12z"/>',
  wave:'<path d="M2 13c2.5-6 5-6 7.5 0s5 6 7.5 0 3.5-3 5-3"/><circle cx="5.5" cy="7" r="1.2"/>',
  orbit:'<circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"/>',
  mouse:'<rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M12 6.5v3.5"/>',
  chart:'<path d="M3 21h18"/><path d="M6 17v-6M11 17V5M16 17v-9M20.5 17v-4"/>',
  table:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9.5h18M3 14.8h18M9.5 9.5V20"/>',
  cube:'<path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M3.5 7.3L12 12l8.5-4.7M12 12v9.5"/>',
  puzzle:'<path d="M5 8h3.2a2.3 2.3 0 1 1 4.6 0H16v3.2a2.3 2.3 0 1 1 0 4.6V19h-3.2a2.3 2.3 0 1 0-4.6 0H5z"/>',
  sparkles:'<path d="M11 3l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"/><path d="M18.5 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/>',
  code:'<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>',
  frame:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M9 21V9"/>',
  cdn:'<path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/><path d="M12 11v6M9.5 14.5L12 17l2.5-2.5"/>',
  npm:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 16V8h8v8M12 8v6"/>',
  question:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.7 2.4c-.7.3-1.2 1-1.2 1.8v.3"/><path d="M12 17.3h.01"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4"/><path d="M12 13v4M8.5 20.5h7M10 17h4v3.5h-4z"/>',
  rocket:'<path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2"/><path d="M9 15l-3-3c1.5-4.5 5.5-8.5 13-9-.5 7.5-4.5 11.5-9 13z"/><circle cx="14.5" cy="9.5" r="1.6"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>'
};
const clay = (icon,color,size='md',extra='') =>
  `<span class="clay ${size} ${extra}" style="--c:${color}"><svg viewBox="0 0 24 24">${ICONS[icon]}</svg></span>`;

/* ===================== DATA ===================== */
const CATS = {
  notif:{name:'Notifikasi & Dialog',icon:'bell',color:'#FF8FA3'},
  ui:{name:'Komponen UI & Form',icon:'puzzle',color:'#7FB2FF'},
  anim:{name:'Animasi & Scroll',icon:'sparkles',color:'#FFC24B'},
  data:{name:'Data & Visualisasi',icon:'chart',color:'#4FC9A8'},
  g3d:{name:'3D & Grafis',icon:'cube',color:'#B48CFF'}
};

const LIBS = [
 {id:'sweetalert',name:'SweetAlert2',cat:'notif',color:'#FF8FA3',icon:'bell',
  tagline:'Alert, confirm & toast yang cantik',
  desc:'Pengganti alert(), confirm() dan prompt() bawaan browser. Tampilannya modern, responsif, aksesibel, dan tanpa dependency.',
  uses:['Konfirmasi sebelum menghapus data','Notifikasi sukses/gagal setelah submit form','Toast kecil di pojok layar'],
  lic:'MIT',site:'sweetalert2.github.io',
  code:`<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"><\/script>

Swal.fire({
  title: 'Yakin hapus data?',
  icon: 'warning',
  showCancelButton: true,
  confirmButtonText: 'Ya, hapus!'
}).then((res) => {
  if (res.isConfirmed) {
    Swal.fire('Terhapus!', '', 'success');

/* ===================== RENDER ===================== */
const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className='slide';sec.dataset.index=i;sec.setAttribute('aria-label',s.title);
  sec.innerHTML=s.html;
  if(s.lib){ sec.querySelector('.snippet').textContent=s.lib.code; }
  deck.appendChild(sec);
});
const els = [...deck.children];
let cur = 0;

function go(n){
  n=Math.max(0,Math.min(els.length-1,n));
  els.forEach((el,i)=>{el.classList.toggle('active',i===n);el.classList.toggle('left',i<n);});
  cur=n;
  document.getElementById('counter').textContent=`${n+1} / ${els.length}`;
  document.getElementById('progress').style.width=`${(n+1)/els.length*100}%`;
  els[n].scrollTop=0;
  history.replaceState(null,'','#'+(n+1));
  renderOverview();
}

document.getElementById('btnPrev').onclick=()=>go(cur-1);
document.getElementById('btnNext').onclick=()=>go(cur+1);
document.getElementById('btnFull').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);closeOverview();}
  const c=e.target.closest('.copy');
  if(c){const code=c.closest('.code-card').querySelector('code').textContent;
    navigator.clipboard?.writeText(code).then(()=>{c.textContent='Tersalin ✓';setTimeout(()=>c.textContent='Salin',1500)}).catch(()=>{});}
  const d=e.target.closest('.btn-demo'); if(d) runDemo(d.closest('.stage'));
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea,[contenteditable],.ts-control')) return;
  if(document.querySelector('.swal2-container')) return;
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(els.length-1);
  else if(e.key.toLowerCase()==='o')toggleOverview();
  else if(e.key.toLowerCase()==='f')document.getElementById('btnFull').click();
  else if(e.key==='Escape')closeOverview();
});
// swipe
let sx=null,sy=null;
deck.addEventListener('touchstart',e=>{
  if(e.target.closest('.stage,pre,.code-card')){sx=null;return;}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
deck.addEventListener('touchend',e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) go(cur+(dx<0?1:-1)); sx=null;});

// overview
const ov=document.getElementById('overview'),ovGrid=document.getElementById('ovGrid');
function renderOverview(){
  ovGrid.innerHTML=slides.map((s,i)=>`<button class="ov-item clay-card ${i===cur?'cur':''}" data-go="${i}">${clay(s.icon[0],s.icon[1],'sm')}<span><small style="color:var(--muted)">${i+1}</small><br>${s.title}</span></button>`).join('');
}
function toggleOverview(){ov.classList.toggle('open');}
function closeOverview(){ov.classList.remove('open');}
document.getElementById('btnOverview').onclick=toggleOverview;
document.getElementById('ovClose').onclick=closeOverview;

    nx.onclick=()=>{qi++;box.dataset.done='0';renderQuiz();};

async function runDemo(st){
  const d=DEMOS[st.dataset.demo]; if(!d||st.dataset.loading)return;
  st.dataset.loading='1';
  st.innerHTML='<span class="stage-label">Demo langsung</span><div class="spinner"></div><small>Memuat library…</small>';
  try{
    (d.css||[]).forEach(loadCSS);
    for(const s of d.js||[]) await loadScript(s);
    const mod=d.esm?await import(d.esm):(d.global?window[d.global]:null);
    if(d.global&&!mod) throw new Error('Global '+d.global+' tidak ditemukan');
    st.innerHTML='<span class="stage-label">Demo langsung</span>';
    d.run(st,mod);
  }catch(err){
    console.error(err);
    st.innerHTML='<span class="stage-label">Demo langsung</span><p class="err">Gagal memuat demo 😢</p><small>Pastikan perangkat terhubung ke internet, lalu coba lagi.</small>';
    const b=h('button',{className:'cbtn sm',textContent:'Coba lagi'});b.onclick=()=>{delete st.dataset.loading;runDemo(st);};st.append(b);
    return;
  }
}
