<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library untuk Dashboard · HSI Boarding School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7EE; --bg2:#FFFFFF; --card:#FFFDF8;
  --ink:#1E2A44; --muted:#6B7280;
  --accent:#1F4E9E; --gold:#D4A017; --gold2:#E8B931; --blue-soft:#5B8DEF;
  --shadow-dark:rgba(150,120,60,.22); --shadow-light:rgba(255,255,255,.95);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 8% 0%,#FFF1CF 0%,transparent 60%),
             radial-gradient(1000px 700px at 100% 100%,#E3ECFB 0%,transparent 60%),
             linear-gradient(160deg,var(--bg2),var(--bg));
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* ===== Clay primitives ===== */
.clay-card{
  background:var(--card);border-radius:32px;
  box-shadow:16px 16px 32px var(--shadow-dark),-10px -10px 24px var(--shadow-light),
             inset 4px 4px 10px rgba(255,255,255,.9),inset -4px -4px 10px rgba(150,120,60,.10);
}
.clay{
  --s:64px;--c:#1F4E9E;
  width:var(--s);height:var(--s);flex:0 0 var(--s);
  border-radius:calc(var(--s)*.34);position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 45%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 82%,#000) 125%);
  box-shadow:
    inset calc(var(--s)*-.07) calc(var(--s)*-.09) calc(var(--s)*.16) rgba(0,0,0,.2),
    inset calc(var(--s)*.07) calc(var(--s)*.07) calc(var(--s)*.14) rgba(255,255,255,.6),
    0 calc(var(--s)*.2) calc(var(--s)*.34) calc(var(--s)*-.1) color-mix(in srgb,var(--c) 75%,transparent);
}
.clay::after{
  content:"";position:absolute;top:11%;left:15%;width:34%;height:17%;border-radius:50%;
  background:rgba(255,255,255,.6);filter:blur(1.5px);transform:rotate(-22deg);
}
.clay svg{width:52%;height:52%;color:#fff;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 calc(var(--s)*.03) 0 rgba(0,0,0,.16));position:relative;z-index:1}
.clay.sm{--s:44px}.clay.md{--s:58px}.clay.lg{--s:84px}.clay.xl{--s:110px}
.clay.btn{border:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.clay.btn:hover{transform:translateY(-6px) rotate(-6deg) scale(1.06)}

.cbtn{
  --c:var(--accent);border:0;border-radius:18px;padding:12px 22px;font-weight:800;font-size:15px;color:#fff;
  background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 70%);
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.18),inset 3px 3px 8px rgba(255,255,255,.5),0 10px 18px -8px color-mix(in srgb,var(--c) 80%,transparent);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.cbtn:hover{transform:translateY(-2px)}.cbtn:active{transform:scale(.95)}
.cbtn.sm{padding:8px 14px;font-size:13px;border-radius:14px}
.cbtn.ghost{--c:#EDE4CF;color:var(--ink)}

.chip{
  --c:#1F4E9E;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;
  color:color-mix(in srgb,var(--c) 60%,#000);background:color-mix(in srgb,var(--c) 18%,#fff);
  box-shadow:inset 2px 2px 4px rgba(255,255,255,.8),inset -2px -2px 4px color-mix(in srgb,var(--c) 25%,transparent);
  border:0;text-decoration:none;
}
button.chip,a.chip{transition:transform .2s}button.chip:hover,a.chip:hover{transform:translateY(-2px)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:14px;background:#fff;font-weight:700;font-size:13px;color:var(--muted);
  box-shadow:4px 4px 10px var(--shadow-dark),-4px -4px 10px var(--shadow-light)}

/* ===== Deck ===== */
.progress{position:fixed;top:0;left:0;height:6px;background:linear-gradient(90deg,#1F4E9E,#5B8DEF,#E8B931,#D4A017);
  border-radius:0 6px 6px 0;transition:width .5s cubic-bezier(.22,1,.36,1);z-index:60}
.brand{position:fixed;top:14px;left:18px;z-index:55;display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;color:var(--muted);
  background:rgba(255,253,248,.85);backdrop-filter:blur(8px);padding:4px 12px 4px 4px;border-radius:999px;box-shadow:3px 3px 8px var(--shadow-dark)}
.brand img{height:24px;width:auto;display:block}
.brand b{color:var(--accent)}
.deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 24px 120px;
  opacity:0;visibility:hidden;transform:translateX(60px) scale(.98);
  transition:opacity .45s ease,transform .55s cubic-bezier(.22,1,.36,1),visibility .45s;
}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.left{transform:translateX(-60px) scale(.98)}
.wrap{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:28px}
h1{font-size:clamp(34px,5.6vw,64px);font-weight:900;line-height:1.05;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,44px);font-weight:900;line-height:1.1;letter-spacing:-.01em}
h3{font-size:21px;font-weight:900}
h4{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
p{font-size:18px;line-height:1.6;color:var(--muted)}
.grad{background:linear-gradient(90deg,#1F4E9E,#5B8DEF 45%,#D4A017);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-weight:900;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:14px}

/* cover */
.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.cover-logo{display:flex;align-items:center;gap:14px}
.cover-logo img{height:64px;width:auto}
.cover-logo b{display:block;font-size:18px;color:var(--ink)}
.cover-logo small{font-weight:700;color:var(--muted)}
.cloud{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;justify-items:center;padding:30px}
.cloud .clay{animation:bob 4s ease-in-out infinite}
.cloud .clay:nth-child(3n){animation-delay:-1.3s}.cloud .clay:nth-child(3n+1){animation-delay:-2.6s}
@keyframes bob{50%{translate:0 -10px}}

/* grids */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box{padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box ul,.box ol{list-style:none;display:flex;flex-direction:column;gap:10px}
.box li{font-size:16px;line-height:1.5;color:var(--muted);padding-left:26px;position:relative}
.box ul li::before{content:"";position:absolute;left:4px;top:7px;width:12px;height:12px;border-radius:50%;
  background:var(--dot,#1F4E9E);box-shadow:inset -2px -2px 3px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.6)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.steps{counter-reset:st}
.steps li{padding-left:44px!important;min-height:32px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:-2px;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
  font-weight:900;color:#fff;background:radial-gradient(circle at 30% 25%,#7FA3E6,#1F4E9E 70%);box-shadow:inset -2px -3px 5px rgba(0,0,0,.2),inset 2px 2px 5px rgba(255,255,255,.5)}
.steps li b{color:var(--ink)}

/* target wireframe */
.wire{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;padding:20px}
.wire-main{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
.wb{--c:#9CA3AF;border:2.5px dashed color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 9%,#fff);border-radius:16px;
  padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-weight:800;font-size:14px;color:var(--ink);min-height:68px}
.wb small{font-weight:700;color:var(--muted);font-size:12.5px}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
.wire-side{min-height:100%}

/* library slide */
.lib{display:grid;grid-template-columns:1fr 1.08fr;gap:32px;align-items:start}
.lib-info{display:flex;flex-direction:column;gap:16px;padding-top:8px;min-width:0}
.lib-head{display:flex;gap:22px;align-items:center}
.lib-head .tag{font-size:17px;font-weight:700;color:var(--muted);margin-top:4px}
.lib-num{font-weight:900;color:var(--muted);font-size:14px;letter-spacing:.1em}
.desc{font-size:18px}
.uses{list-style:none;display:flex;flex-direction:column;gap:10px}
.uses li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:16px;background:#fff;padding:12px 16px;border-radius:18px;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.uses li::before{content:"";width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:var(--c);
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.6)}
.kantin-note{--c:#D4A017;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;
  background:color-mix(in srgb,var(--c) 10%,#fff);border:2px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.kantin-note p{font-size:15px;color:var(--ink);line-height:1.5}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.lib-side{display:flex;flex-direction:column;gap:20px;min-width:0}

.code-card{background:#1E2A44;border-radius:26px;overflow:hidden;min-width:0;
  box-shadow:14px 14px 30px rgba(30,42,68,.32),inset 3px 3px 8px rgba(255,255,255,.08),inset -3px -3px 8px rgba(0,0,0,.4)}
.code-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px 0 20px;color:#AFB8D0;font:600 13px 'JetBrains Mono',monospace}
.dots{display:flex;gap:6px;margin-right:10px}.dots i{width:11px;height:11px;border-radius:50%;background:#E8735A}
.dots i:nth-child(2){background:#E8B931}.dots i:nth-child(3){background:#5FBF8F}
.code-card pre{padding:14px 20px 20px;overflow:auto;max-height:300px}
.code-card.tall pre{max-height:420px}
.code-card code{font:400 13.5px/1.65 'JetBrains Mono',monospace;color:#EDEFF8;white-space:pre}
.copy,.dl{background:#2D3B5C;color:#EDEFF8;border:0;border-radius:10px;padding:6px 12px;font-weight:800;font-size:12px}
.mini{background:#1E2A44;border-radius:16px;padding:12px 14px;overflow:auto}
.mini code{font:400 12.5px/1.6 'JetBrains Mono',monospace;color:#EDEFF8;white-space:pre}

.stage{position:relative;padding:46px 22px 22px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-width:0}
.stage small{color:var(--muted);font-weight:700}
.stage .err{color:#C2412D;font-weight:800}
.stage-label{position:absolute;top:14px;left:20px;font-weight:900;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.spinner{width:42px;height:42px;border-radius:50%;border:5px solid #EDE4CF;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stack{display:flex}
.stack .clay{margin-right:-10px;border:3px solid var(--card)}

/* demo bits */
.tip{position:absolute;top:0;left:0;background:#1E2A44;color:#fff;padding:8px 12px;border-radius:12px;font-weight:700;font-size:13px;line-height:1.4;
  pointer-events:none;opacity:0;transition:opacity .15s;max-width:240px;text-align:left;z-index:20}
.demo-input{width:100%;max-width:340px;padding:12px 16px;border-radius:16px;border:0;font:700 15px 'Nunito',system-ui,sans-serif;background:#fff;color:var(--ink);
  box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -3px -3px 8px var(--shadow-light)}
.kpi{background:#fff;border-radius:20px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.kpi-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted)}
.kpi b{font-size:22px;font-weight:900;color:var(--ink)}
.kinfo{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:0;font:900 13px 'Nunito',system-ui,sans-serif;color:#fff;
  background:radial-gradient(circle at 30% 25%,#F2D27A,#D4A017 70%);box-shadow:inset -2px -2px 4px rgba(0,0,0,.2),inset 2px 2px 4px rgba(255,255,255,.5)}
.kpi-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:460px}
.promo-list{display:flex;flex-direction:column;gap:8px}
.promo-item{--c:#1F4E9E;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 10%,#fff);border-left:4px solid var(--c)}
.promo-item .pe{font-size:24px;line-height:1}
.promo-item b{display:block;font-size:14px;font-weight:900;color:var(--ink)}
.promo-item small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.chart-wrap{position:relative;width:100%;height:220px}
.chart-pair{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;width:100%}
.tab-wrap{width:100%;text-align:left;min-width:0}
.tomsel-wrap{width:100%;max-width:380px;text-align:left}
.flatpickr-calendar.inline{max-width:100%}
.ts-wrapper .ts-control{border-radius:14px;border:0;padding:8px 10px;box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -3px -3px 8px var(--shadow-light);font-family:'Nunito',system-ui,sans-serif;font-weight:700}
.ts-wrapper.multi .ts-control>div{background:#E3ECFB;color:#1F4E9E;border-radius:8px;font-weight:800}
.tabulator{border-radius:14px;font-family:'Nunito',system-ui,sans-serif;font-size:14px}
.t-del{border:0;background:#FDE8E3;border-radius:10px;padding:4px 8px;font-size:14px}

/* dashboard demo */
.stage.wide{padding:46px 18px 18px}
.dash{position:relative;width:100%;display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;text-align:left}
.dash-side{background:linear-gradient(170deg,#1F4E9E,#163A78);color:#fff;border-radius:22px;padding:18px 14px;display:flex;flex-direction:column;gap:18px;
  box-shadow:inset 3px 3px 8px rgba(255,255,255,.15),inset -3px -3px 8px rgba(0,0,0,.25),8px 10px 20px -8px rgba(31,78,158,.5)}
.dash-brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:900}
.dash-brand small{display:block;font-size:11px;font-weight:700;color:#C9D6F2}
.dash-side nav{display:flex;flex-direction:column;gap:6px}
.dash-side a{padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;color:#DCE6FA;text-decoration:none}
.dash-side a.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 2px 2px 5px rgba(255,255,255,.15)}
.dash-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.dash-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end}
.dash-top small{font-weight:700;color:var(--muted)}
.dash-filter{display:flex;gap:12px;flex-wrap:wrap;flex:1 1 360px;justify-content:flex-end}
.dash-filter label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:900;color:var(--muted);flex:1 1 170px;max-width:270px;letter-spacing:.04em;text-transform:uppercase}
.dash-filter label>*{text-transform:none;letter-spacing:normal}
.dash-filter .demo-input{max-width:none;padding:10px 12px;font-size:14px}
.dash-filter .flatpickr-wrapper{width:100%}
.dash-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dash-charts,.dash-bottom{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.dpanel{background:#fff;border-radius:20px;padding:14px;min-width:0;box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.dpanel h5{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* integrasi */
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;padding:24px}
.fcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.fnode{--c:#1F4E9E;display:flex;gap:12px;align-items:center;background:#fff;border:0;border-left:5px solid var(--c);border-radius:18px;padding:10px 12px;text-align:left;
  font:inherit;color:var(--ink);box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light)}
.fnode b{display:block;font-size:15px}
.fnode small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;font-family:'JetBrains Mono',monospace}
.fcore{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:20px 16px;border-radius:24px;
  background:linear-gradient(160deg,#FFF6DD,#FFFDF8);border:2.5px dashed #D4A017}
.fcore b{font:600 17px 'JetBrains Mono',monospace;color:var(--ink)}
.fcore small{font-weight:700;color:var(--muted)}
.farrow{font-size:30px;font-weight:900;color:var(--gold)}

/* jebakan */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.trap{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.trap-h{display:flex;gap:12px;align-items:center}
.trap-h h3{font-size:18px}
.trap p{font-size:15px}

/* quiz */
.quiz{padding:30px;display:flex;flex-direction:column;gap:18px;max-width:780px;width:100%;margin:0 auto}
.qtext{font-size:22px;font-weight:900;color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:20px;background:#fff;font-weight:800;font-size:16px;color:var(--ink);text-align:left;
  box-shadow:6px 6px 14px var(--shadow-dark),-6px -6px 14px var(--shadow-light);transition:transform .2s}
.opt:hover{transform:translateY(-3px)}
.opt.right{background:#DFF5E6;box-shadow:inset 3px 3px 8px rgba(80,170,110,.35)}
.opt.wrong{background:#FDE5DF;box-shadow:inset 3px 3px 8px rgba(194,65,45,.3)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qfeedback{font-weight:800;min-height:24px}

/* tugas */
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:#fff;font-weight:700;font-size:15px;cursor:pointer;
  box-shadow:5px 5px 12px var(--shadow-dark),-5px -5px 12px var(--shadow-light);transition:background .2s}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:#F3ECDC;cursor:pointer;
  box-shadow:inset 2px 2px 5px var(--shadow-dark),inset -2px -2px 5px var(--shadow-light);display:grid;place-items:center}
.check input:checked{background:radial-gradient(circle at 30% 25%,#F2D27A,#D4A017 70%);box-shadow:inset -2px -2px 4px rgba(0,0,0,.2),inset 2px 2px 4px rgba(255,255,255,.5)}
.check input:checked::after{content:"✓";color:#fff;font-weight:900;font-size:14px}
.check:has(input:checked){background:#FFF8E4}
.check:has(input:checked) span{color:var(--muted);text-decoration:line-through}
.meter{height:12px;border-radius:999px;background:#F3ECDC;box-shadow:inset 2px 2px 5px var(--shadow-dark);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1F4E9E,#E8B931);border-radius:999px;transition:width .4s}

/* penutup */
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.doc{padding:18px;display:flex;gap:14px;align-items:center;min-width:0}
.doc b{display:block;font-size:16px}
.doc p{font-size:14px;line-height:1.4}

/* nav */
.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:26px;z-index:50;
  background:rgba(255,253,248,.92);backdrop-filter:blur(10px)}
.nav .nbtn{width:46px;height:46px;border-radius:16px;border:0;display:grid;place-items:center;color:var(--ink);background:var(--card);
  box-shadow:5px 5px 12px var(--shadow-dark),-5px -5px 12px var(--shadow-light);transition:transform .2s}
.nav .nbtn:active{transform:scale(.92);box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -3px -3px 8px var(--shadow-light)}
.nav .nbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nav .nbtn.primary{background:var(--accent);color:#fff;box-shadow:inset -3px -4px 8px rgba(0,0,0,.2),inset 3px 3px 8px rgba(255,255,255,.4),0 8px 16px -6px var(--accent)}
.counter{font-weight:900;min-width:70px;text-align:center;font-size:15px}

.overview{position:fixed;inset:0;z-index:70;background:rgba(251,247,238,.96);backdrop-filter:blur(6px);padding:40px 24px;overflow:auto;display:none}
.overview.open{display:block}
.ov-grid{max-width:1120px;margin:20px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.ov-item{border:0;padding:18px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:800;font-size:15px;color:var(--ink);border-radius:24px}
.ov-item.cur{outline:3px solid var(--gold)}
.ov-head{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}

.hint{color:var(--muted);font-weight:700;font-size:14px}
kbd{font:700 12px 'JetBrains Mono';background:#fff;padding:3px 8px;border-radius:8px;box-shadow:2px 2px 5px var(--shadow-dark)}

@media (max-width:860px){
  .cover,.two,.lib{grid-template-columns:1fr}
  .cloud{gap:14px;padding:16px}

function hitung(produk,awal,akhir,kategori){
  const map=new Map(produk.map(p=>[p.id,p]));
  const data=TRX.filter(t=>{const p=map.get(t.produkId);return p&&t.tgl>=awal&&t.tgl<=akhir&&kategori.includes(p.kategori);});
  const hari=[];for(let d=new Date(awal);d<=akhir&&hari.length<93;d.setDate(d.getDate()+1))hari.push(new Date(d));
  const perHari=hari.map(d=>data.filter(t=>+t.tgl===+d).reduce((s,t)=>s+t.qty*map.get(t.produkId).harga,0));
  const perKat=KAT.map(k=>data.filter(t=>map.get(t.produkId).kategori===k).reduce((s,t)=>s+t.qty,0));
  const rows=produk.filter(p=>kategori.includes(p.kategori)).map(p=>{
    const q=data.filter(t=>t.produkId===p.id).reduce((s,t)=>s+t.qty,0);
    return {...p,terjual:q,omzet:q*p.harga};
  });
  return {
    labels:hari.map(d=>d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric'})),
    perHari,perKat,rows,
    omzet:perHari.reduce((a,b)=>a+b,0),
    item:data.reduce((s,t)=>s+t.qty,0),
    trx:data.length
  };
}

<script>
// ---------- DATA DUMMY ----------
const hariIni = new Date();
hariIni.setHours(0, 0, 0, 0);
function hariLalu(n) {
  const d = new Date(hariIni);
  d.setDate(d.getDate() - n);
  return d;
}

let produk = [
  { id: 1,  nama: 'Nasi Goreng',      kategori: 'Makanan', harga: 10000, stok: 25 },
  { id: 2,  nama: 'Mie Ayam',         kategori: 'Makanan', harga: 8000,  stok: 20 },
  { id: 3,  nama: 'Nasi Uduk',        kategori: 'Makanan', harga: 7000,  stok: 30 },
  { id: 4,  nama: 'Es Teh Manis',     kategori: 'Minuman', harga: 3000,  stok: 60 },
  { id: 5,  nama: 'Jus Jeruk',        kategori: 'Minuman', harga: 6000,  stok: 24 },
  { id: 6,  nama: 'Air Mineral',      kategori: 'Minuman', harga: 4000,  stok: 80 },
  { id: 7,  nama: 'Keripik Singkong', kategori: 'Snack',   harga: 5000,  stok: 40 },
  { id: 8,  nama: 'Roti Coklat',      kategori: 'Snack',   harga: 4000,  stok: 35 },
  { id: 9,  nama: 'Pisang Goreng',    kategori: 'Snack',   harga: 2000,  stok: 50 },
  { id: 10, nama: 'Susu Kotak',       kategori: 'Minuman', harga: 5000,  stok: 45 }
];

// [berapa hari lalu, id produk, jumlah]
const transaksi = [
  [6, 1, 12], [6, 4, 20], [6, 7, 8],  [5, 2, 10], [5, 5, 9],  [5, 9, 15], [4, 3, 14],
  [4, 6, 18], [4, 8, 7],  [3, 1, 11], [3, 10, 12], [3, 7, 10], [2, 2, 13], [2, 4, 22],
  [2, 9, 12], [1, 3, 9],  [1, 5, 8],  [1, 8, 11], [0, 1, 15], [0, 6, 16], [0, 10, 9]
].map(t => ({ tgl: hariLalu(t[0]), produkId: t[1], qty: t[2] }));

// ---------- STATE FILTER ----------
const state = {
  awal: hariLalu(6),
  akhir: hariIni,
  kategori: ['Makanan', 'Minuman', 'Snack']
};

// ---------- FUNGSI BANTU ----------
const rupiah = n => 'Rp' + n.toLocaleString('id-ID');
const cariProduk = id => produk.find(p => p.id === id);

function dataTerfilter() {
  return transaksi.filter(t => {
    const p = cariProduk(t.produkId);
    return p && t.tgl >= state.awal && t.tgl <= state.akhir && state.kategori.includes(p.kategori);
  });
}

// ---------- TODO: inisialisasi library ----------
// TODO 1 Flatpickr  : mode 'range' di #tanggal; saat 2 tanggal terpilih -> isi state lalu applyFilter()
// TODO 2 Tom Select : #kategori; onChange -> state.kategori = [].concat(nilai); applyFilter()
// TODO 3 Chart.js   : grafik bar (omzet per hari) + doughnut (item per kategori), simpan di variabel
// TODO 4 Tabulator  : tabel produk + kolom tombol hapus
// TODO 5 SweetAlert2: konfirmasi sebelum hapus, lalu toast sukses
// TODO 6 Floating UI: tooltip untuk setiap tombol .info (pakai autoUpdate)

// ---------- UPDATE DASHBOARD ----------
function applyFilter() {
  const data = dataTerfilter();
  let omzet = 0, item = 0;
  data.forEach(t => {
    omzet += cariProduk(t.produkId).harga * t.qty;
    item += t.qty;
  });
  document.getElementById('kpiOmzet').textContent = rupiah(omzet);
  document.getElementById('kpiItem').textContent = item + ' item';
  document.getElementById('kpiTrx').textContent = data.length + ' transaksi';

  // TODO: perbarui grafik -> grafik.data.datasets[0].data = ...; grafik.update();
  // TODO: perbarui tabel  -> tabel.replaceData(...);
}

applyFilter();
console.log('Starter siap!', produk.length, 'produk,', transaksi.length, 'transaksi');
<\/script>

const els = [...deck.children];
let cur = 0;

function go(n){
  n=Math.max(0,Math.min(els.length-1,n));
  if(n!==cur) resetSlide(cur);
  els.forEach((el,i)=>{el.classList.toggle('active',i===n);el.classList.toggle('left',i<n);});
  cur=n;
  document.getElementById('counter').textContent=`${n+1} / ${els.length}`;
  document.getElementById('progress').style.width=`${(n+1)/els.length*100}%`;
  els[n].scrollTop=0;
  history.replaceState(null,'','#'+(n+1));
  renderOverview();
}

document.getElementById('btnPrev').onclick=()=>go(cur-1);
document.getElementById('btnNext').onclick=()=>go(cur+1);
document.getElementById('btnFull').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);closeOverview();}
  const c=e.target.closest('.copy');
  if(c){const code=c.closest('.code-card').querySelector('code').textContent;
    navigator.clipboard?.writeText(code).then(()=>{c.textContent='Tersalin ✓';setTimeout(()=>c.textContent='Salin',1500)}).catch(()=>{c.textContent='Gagal ✕';setTimeout(()=>c.textContent='Salin',1500)});}
  if(e.target.closest('#dlStarter')){
    const url=URL.createObjectURL(new Blob([CODES.starter],{type:'text/html'}));
    const a=h('a',{href:url,download:'starter-dashboard-kantin.html'});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  const d=e.target.closest('.btn-demo'); if(d) runDemo(d.closest('.stage'));
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input:not([type=checkbox]),select,textarea,[contenteditable],.ts-wrapper,.flatpickr-calendar')) return;
  if(document.querySelector('.swal2-container .swal2-popup:not(.swal2-toast)')) return;
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(els.length-1);
  else if(e.key.toLowerCase()==='o')toggleOverview();
  else if(e.key.toLowerCase()==='f')document.getElementById('btnFull').click();
  else if(e.key==='Escape')closeOverview();
});

deck.addEventListener('touchstart',e=>{

const cache={};
function loadScript(src){return cache[src]??=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete cache[src];s.remove();rej(new Error('Gagal memuat '+src));};document.head.appendChild(s);});}
function loadCSS(href){if(cache[href])return;cache[href]=1;const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l);}
const h=(tag,props={},kids=[])=>{const e=Object.assign(document.createElement(tag),props);kids.forEach(k=>e.append(k));return e;};
const cbtn=(text,color,sm)=>{const b=h('button',{className:'cbtn'+(sm?' sm':''),textContent:text});if(color)b.style.setProperty('--c',color);return b;};

  tomselect:{css:[JD+'tom-select@2/dist/css/tom-select.css'],js:[JD+'tom-select@2/dist/js/tom-select.complete.min.js']},

async function loadLibs(ids){
  ids.forEach(id=>(LIBJS[id].css||[]).forEach(loadCSS));
  // tiap library dimuat paralel, file di dalam satu library berurutan (core → dom)
  await Promise.all(ids.map(async id=>{for(const s of LIBJS[id].js) await loadScript(s);}));
}

/* Tooltip Floating UI dengan autoUpdate + cleanup. Mengembalikan fungsi pembersih. */
function attachTips(m,root,tip,selector){
  let stop=null;
  const hide=()=>{tip.style.opacity=0;stop?.();stop=null;};
  root.querySelectorAll(selector).forEach(b=>{
    const show=()=>{
      stop?.();
      tip.textContent=b.dataset.tip;tip.style.opacity=1;
      stop=m.autoUpdate(b,tip,()=>m.computePosition(b,tip,{placement:'top',middleware:[m.offset(8),m.flip(),m.shift({padding:8})]})
        .then(({x,y})=>Object.assign(tip.style,{left:x+'px',top:y+'px'})));
    };
    b.addEventListener('mouseenter',show);b.addEventListener('focus',show);
    b.addEventListener('mouseleave',hide);b.addEventListener('blur',hide);
  });
  return hide;
}

          <div class="dash-filter">
            <label>Tanggal<input class="demo-input f-date" placeholder="Pilih rentang"></label>
            <label>Kategori<select class="f-kat" multiple>${KAT.map(k=>`<option value="${k}" selected>${k}</option>`).join('')}</select></label>
          </div>
        </div>
        <div class="dash-kpis">
          ${kpiCard('omzet','💰 Omzet','Total uang masuk (harga × jumlah) dalam rentang tanggal & kategori terpilih.')}
          ${kpiCard('item','🧺 Item terjual','Jumlah porsi/barang yang terjual pada filter saat ini.')}
          ${kpiCard('trx','🧾 Transaksi','Banyaknya catatan transaksi yang lolos filter.')}
        </div>
        <div class="dash-charts">
          <div class="dpanel"><h5>Omzet per hari</h5><div class="chart-wrap"><canvas class="c-bar"></canvas></div></div>
          <div class="dpanel"><h5>Item per kategori</h5><div class="chart-wrap"><canvas class="c-dn"></canvas></div></div>
        </div>
        <div class="dash-bottom">
          <div class="dpanel"><h5>Produk</h5><div class="t-prod"></div></div>
          <div class="dpanel"><h5>Promo minggu ini</h5>${promoList()}</div>
        </div>
      </div>
      <div class="tip"></div>`;
    st.append(root,h('small',{textContent:'Coba ubah tanggal atau kategori: KPI, grafik, dan tabel ikut berubah. Klik 🗑️ untuk menghapus produk.'}));
    const $=s=>root.querySelector(s);

    // Floating UI
    const hideTip=attachTips(m,root,$('.tip'),'.kinfo');

    // Chart.js
    let r=hitung(produk,state.awal,state.akhir,state.kategori);
    const bar=barChart($('.c-bar'),r), dn=doughnutChart($('.c-dn'),r);

    // Tabulator + SweetAlert2
    let ready=false;
    const hapus=p=>Swal.fire({title:`Hapus ${p.nama}?`,text:'Produk dan transaksinya hilang dari laporan.',icon:'warning',showCancelButton:true,
      confirmButtonText:'Ya, hapus',cancelButtonText:'Batal',confirmButtonColor:'#E8735A',cancelButtonColor:'#9CA3AF',reverseButtons:true})
      .then(res=>{if(!res.isConfirmed)return;produk=produk.filter(x=>x.id!==p.id);applyFilter();toast(`${p.nama} dihapus`);});
    const table=new Tabulator($('.t-prod'),{data:r.rows,index:'id',layout:'fitColumns',pagination:true,paginationSize:5,
      placeholder:'Tidak ada produk',initialSort:[{column:'omzet',dir:'desc'}],columns:[
      {title:'Produk',field:'nama',headerFilter:'input',headerFilterPlaceholder:'cari…',minWidth:130},
      {title:'Kategori',field:'kategori',minWidth:90},
      {title:'Terjual',field:'terjual',sorter:'number',hozAlign:'center',minWidth:80},
      {title:'Omzet',field:'omzet',sorter:'number',formatter:c=>rupiah(c.getValue()),minWidth:100},
      {title:'',field:'id',headerSort:false,hozAlign:'center',width:64,formatter:()=>'<button class="t-del" title="Hapus">🗑️</button>',
        cellClick:(e,cell)=>hapus(cell.getRow().getData())}
    ]});
    table.on('tableBuilt',()=>{ready=true;});

    // Fungsi pusat
    function renderKPI(){
      $('[data-k=omzet]').textContent=rupiah(r.omzet);
      $('[data-k=item]').textContent=r.item+' item';
      $('[data-k=trx]').textContent=r.trx+' transaksi';
      $('.d-range').textContent=`${fmtTgl(state.awal)} – ${fmtTgl(state.akhir)} · ${state.kategori.length} kategori · ${produk.length} produk`;
    }
    function applyFilter(){
      r=hitung(produk,state.awal,state.akhir,state.kategori);
      bar.data.labels=r.labels;bar.data.datasets[0].data=r.perHari;bar.update();
      dn.data.datasets[0].data=r.perKat;dn.update();
      if(ready)table.replaceData(r.rows);
      renderKPI();
    }

    // Filter: Flatpickr + Tom Select
    const fp=flatpickr($('.f-date'),{mode:'range',dateFormat:'d M Y',locale:'id',maxDate:'today',static:true,defaultDate:[state.awal,state.akhir],
      onChange:d=>{if(d.length===2){[state.awal,state.akhir]=d;applyFilter();}}});
    const ts=new TomSelect($('.f-kat'),{maxItems:null,plugins:['remove_button'],placeholder:'Pilih kategori',
      onChange:v=>{state.kategori=toArr(v);applyFilter();}});

    renderKPI();
    return ()=>{hideTip();Swal.close();bar.destroy();dn.destroy();table.destroy();ts.destroy();fp.destroy();};
  }}
};

async function runDemo(st){
  const d=DEMOS[st.dataset.demo]; if(!d||st.dataset.loading)return;
  st.dataset.loading='1';
  const token=st._token=(st._token||0)+1;
  st.innerHTML='<span class="stage-label">Demo langsung</span><div class="spinner"></div><small>Memuat library…</small>';
  try{
    await loadLibs(d.libs);
    if(st._token!==token)return;           // sudah pindah slide saat memuat
    if(d.libs.includes('floating')&&!window.FloatingUIDOM) throw new Error('FloatingUIDOM tidak ditemukan');
    st.innerHTML='<span class="stage-label">Demo langsung</span>';
    st.dataset.ran='1';
    const c=d.run(st);
    st._cleanup=typeof c==='function'?c:null;
  }catch(err){
    if(st._token!==token)return;
    console.error(err);
    st.innerHTML='<span class="stage-label">Demo langsung</span><p class="err">Gagal memuat demo 😢</p><small>Pastikan perangkat terhubung ke internet, lalu coba lagi.</small>';
    const b=cbtn('Coba lagi',null,true);b.onclick=()=>{delete st.dataset.loading;runDemo(st);};st.append(b);
  }
}
/* Bersihkan instance saat meninggalkan slide: hindari memory leak & listener yatim */
function resetStage(st){
  st._token=(st._token||0)+1;
  if(st._cleanup){try{st._cleanup();}catch(e){console.warn(e);}st._cleanup=null;}
  if(st.dataset.ran||st.dataset.loading) st.innerHTML=st._initial;
  delete st.dataset.loading;delete st.dataset.ran;
}
function resetSlide(i){
  els[i]?.querySelectorAll('.stage[data-demo]').forEach(resetStage);
  if(window.Swal&&Swal.isVisible())Swal.close();
}

/* start */
const start=parseInt(location.hash.slice(1));
go(Number.isFinite(start)?start-1:0);
</script>
